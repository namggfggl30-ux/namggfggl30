<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Group Messenger - Tự Động Thêm Thành Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #0a0a0a;
            --chat-bg: #121212;
            --neon-yellow: #ffd700;
            --neon-glow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2);
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --bubble-me: #2a2500;
            --bubble-other: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Màn hình Đăng nhập / Đăng ký */
        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--chat-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            box-shadow: var(--neon-glow);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h1 {
            color: var(--neon-yellow);
            font-size: 1.8rem;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--neon-yellow);
            color: var(--bg-black);
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .auth-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .auth-switch {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--neon-yellow);
            cursor: pointer;
            font-weight: 500;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        /* Giao diện Nhóm Chat chính */
        .messenger-container {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            background-color: var(--chat-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            box-shadow: var(--neon-glow);
            display: none; /* Mặc định ẩn khi chưa đăng nhập */
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 320px;
            border-right: 1px solid #332d00;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #221e00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header-info h2 {
            font-size: 1.1rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
            margin-bottom: 3px;
        }

        .sidebar-header-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .logout-icon {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .logout-icon:hover {
            background-color: #221e00;
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .member-list-section {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }

        .member-list-section h4 {
            font-size: 0.85rem;
            color: var(--neon-yellow);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            transition: 0.2s;
            margin-bottom: 6px;
        }

        .member-item:hover {
            background-color: #1c1900;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #222;
            border: 1px solid var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--neon-yellow);
            position: relative;
            flex-shrink: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--bg-black);
            box-shadow: 0 0 5px #00ff00;
        }

        .member-info h5 {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .member-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #221e00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-info h3 {
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: var(--neon-yellow);
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .message-wrapper.incoming {
            align-items: flex-start;
        }

        .message-wrapper.outgoing {
            align-items: flex-end;
        }

        .sender-name-tag {
            font-size: 0.72rem;
            color: var(--neon-yellow);
            margin-bottom: 3px;
            margin-left: 5px;
        }

        .message-container-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 75%;
        }

        .message-wrapper.incoming .message-container-inner {
            flex-direction: row;
        }

        .message-wrapper.outgoing .message-container-inner {
            flex-direction: row-reverse;
        }

        .message {
            padding: 10px 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.incoming {
            background-color: var(--bubble-other);
            color: var(--text-main);
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: var(--bubble-me);
            color: var(--text-main);
            border: 1px solid #594d00;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.1);
        }

        .message.revoked {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed #444;
            font-style: italic;
        }

        .message img, .message video {
            max-width: 240px;
            border-radius: 8px;
            display: block;
        }

        .unsend-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }

        .message-wrapper.outgoing:hover .unsend-btn {
            opacity: 1;
        }

        .unsend-btn:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .message-info {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            gap: 6px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-top: 1px solid #221e00;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .chat-input-area .tools {
            display: flex;
            gap: 12px;
        }

        .chat-input-area .tools i {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-area .tools i:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Emoji Picker Popup */
        .picker-popup {
            position: absolute;
            bottom: 75px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid var(--neon-yellow);
            border-radius: 12px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            box-shadow: var(--neon-glow);
            z-index: 100;
            max-width: 280px;
        }

        .picker-popup span {
            font-size: 1.4rem;
            cursor: pointer;
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .picker-popup span:hover {
            background: #332d00;
            transform: scale(1.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #332d00; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-yellow); }
    </style>
</head>
<body>

    <div class="auth-container" id="authBox">
        <div class="auth-header">
            <h1 id="authTitle">Đăng Nhập</h1>
            <p id="authSubtitle">Tham gia vào phòng chat nhóm Neon</p>
        </div>
        <div class="auth-form">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label>Tên hiển thị trong nhóm</label>
                <input type="text" id="regName" placeholder="Nhập tên của bạn...">
            </div>
            <div class="input-group">
                <label>Tài khoản</label>
                <input type="text" id="authUsername" placeholder="Nhập tài khoản...">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="authPassword" placeholder="Nhập mật khẩu...">
            </div>
            <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">Đăng Nhập</button>
            <div class="auth-switch" id="authSwitchText">
                Chưa có tài khoản? <span onclick="toggleAuthMode()">Đăng ký ngay</span>
            </div>
        </div>
    </div>

    <div class="messenger-container" id="messengerBox">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-info">
                    <h2>Nhóm Sáng Tạo Neon ⚡</h2>
                    <span id="memberCountText">0 thành viên</span>
                </div>
                <i class="fa-solid fa-right-from-bracket logout-icon" title="Đăng xuất" onclick="logout()"></i>
            </div>
            <div class="member-list-section">
                <h4>Thành viên trong nhóm</h4>
                <div id="dynamicMemberList">
                    </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar" style="width: 38px; height: 38px; font-size: 0.85rem;">⚡</div>
                    <div class="chat-header-info">
                        <h3>Phòng Chat Chung Của Nhóm</h3>
                        <span>Gửi tin nhắn, ảnh, video & icon thoải mái</span>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                </div>

            <div class="picker-popup" id="emojiPicker">
                <span onclick="insertEmoji('😀')">😀</span>
                <span onclick="insertEmoji('😂')">😂</span>
                <span onclick="insertEmoji('😍')">😍</span>
                <span onclick="insertEmoji('😎')">😎</span>
                <span onclick="insertEmoji('🤔')">🤔</span>
                <span onclick="insertEmoji('👍')">👍</span>
                <span onclick="insertEmoji('❤️')">❤️</span>
                <span onclick="insertEmoji('🔥')">🔥</span>
                <span onclick="insertEmoji('⭐')">⭐</span>
                <span onclick="insertEmoji('🎉')">🎉</span>
                <span onclick="insertEmoji('🚀')">🚀</span>
                <span onclick="insertEmoji('⚡')">⚡</span>
                <span onclick="insertEmoji('💡')">💡</span>
                <span onclick="insertEmoji('✨')">✨</span>
                <span onclick="insertEmoji('🎯')">🎯</span>
                <span onclick="insertEmoji('💻')">💻</span>
                <span onclick="insertEmoji('🍀')">🍀</span>
                <span onclick="insertEmoji('🍻')">🍻</span>
            </div>

            <div class="chat-input-area">
                <div class="tools">
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">
                    <i class="fa-solid fa-circle-plus" title="Tải ảnh hoặc video từ máy" onclick="document.getElementById('mediaInput').click()"></i>
                    <i class="fa-regular fa-face-smile" title="Chọn Icon" onclick="toggleEmojiPicker()"></i>
                </div>
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn vào nhóm..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = "";

        // Danh sách thành viên tự động (Bắt đầu với 2 thành viên mặc định)
        let groupMembers = [
            { name: "Admin Neon", role: "Trưởng nhóm" },
            { name: "Bot AI Cyber", role: "Trợ lý ảo" }
        ];

        let groupMessages = [
            { id: 1, sender: 'incoming', senderName: 'Admin Neon', text: 'Chào mừng các bạn đã đến với Nhóm Sáng Tạo Neon! 🚀', time: '10:00', isRevoked: false }
        ];

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('authSwitchText');
            const nameGroup = document.getElementById('nameGroup');

            if (isRegisterMode) {
                title.innerText = "Đăng Ký";
                subtitle.innerText = "Tạo tài khoản và tự động tham gia nhóm chat";
                submitBtn.innerText = "Đăng Ký & Tham Gia";
                switchText.innerHTML = 'Đã có tài khoản? <span onclick="toggleAuthMode()">Đăng nhập</span>';
                nameGroup.style.display = "flex";
            } else {
                title.innerText = "Đăng Nhập";
                subtitle.innerText = "Tham gia vào phòng chat nhóm Neon";
                submitBtn.innerText = "Đăng Nhập";
                switchText.innerHTML = 'Chưa có tài khoản? <span onclick="toggleAuthMode()">Đăng ký ngay</span>';
                nameGroup.style.display = "none";
            }
        }

        function handleAuth() {
            const userAcc = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();

            if (!userAcc || !pass) {
                alert("Vui lòng điền đầy đủ tài khoản và mật khẩu!");
                return;
            }

            if (isRegisterMode) {
                const name = document.getElementById('regName').value.trim();
                if (!name) {
                    alert("Vui lòng nhập tên hiển thị trong nhóm!");
                    return;
                }

                // Tự động thêm tài khoản vừa đăng ký vào danh sách thành viên nhóm
                groupMembers.push({ name: name, role: "Thành viên mới" });
                
                // Thêm tin nhắn hệ thống chào mừng thành viên mới vào nhóm
                groupMessages.push({
                    id: Date.now(),
                    sender: 'incoming',
                    senderName: 'Hệ Thống',
                    text: `🎉 Chào mừng thành viên mới [${name}] vừa đăng ký và tham gia nhóm!`,
                    time: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0'),
                    isRevoked: false
                });

                currentUser = name;
                alert("Đăng ký thành công! Hệ thống đã tự động thêm bạn vào nhóm.");
                enterMessenger();
            } else {
                // Đăng nhập bình thường (lấy tạm tên tài khoản làm tên hiển thị nếu chưa có)
                currentUser = userAcc;
                if (!groupMembers.some(m => m.name === currentUser)) {
                    groupMembers.push({ name: currentUser, role: "Thành viên" });
                }
                enterMessenger();
            }
        }

        function enterMessenger() {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('messengerBox').style.display = 'flex';
            renderMembers();
            renderMessages();
        }

        function logout() {
            document.getElementById('messengerBox').style.display = 'none';
            document.getElementById('authBox').style.display = 'flex';
            document.getElementById('authUsername').value = "";
            document.getElementById('authPassword').value = "";
            document.getElementById('regName').value = "";
        }

        function renderMembers() {
            const listContainer = document.getElementById('dynamicMemberList');
            listContainer.innerHTML = "";
            
            document.getElementById('memberCountText').innerText = `${groupMembers.length} thành viên`;

            groupMembers.forEach(member => {
                let initial = member.name.charAt(0).toUpperCase();
                let div = document.createElement('div');
                div.classList.add('member-item');
                div.innerHTML = `
                    <div class="avatar">${initial}<div class="status-dot"></div></div>
                    <div class="member-info">
                        <h5>${member.name} ${member.name === currentUser ? '(Bạn)' : ''}</h5>
                        <p>${member.role}</p>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function renderMessages() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = "";
            
            groupMessages.forEach(msg => {
                let wrapper = document.createElement('div');
                wrapper.classList.add('message-wrapper', msg.sender);
                
                if (msg.sender === 'incoming') {
                    let nameTag = document.createElement('div');
                    nameTag.className = 'sender-name-tag';
                    nameTag.innerText = msg.senderName;
                    wrapper.appendChild(nameTag);
                }

                let innerContainer = document.createElement('div');
                innerContainer.classList.add('message-container-inner');

                let msgBox = document.createElement('div');
                
                if (msg.isRevoked) {
                    msgBox.className = "message revoked";
                    msgBox.innerText = "Tin nhắn đã được thu hồi";
                } else {
                    msgBox.className = `message ${msg.sender}`;
                    if(msg.type === 'image') {
                        msgBox.innerHTML = `<img src="${msg.text}" alt="Uploaded Image">`;
                    } else if(msg.type === 'video') {
                        msgBox.innerHTML = `<video src="${msg.text}" controls></video>`;
                    } else {
                        msgBox.innerText = msg.text;
                    }
                }

                innerContainer.appendChild(msgBox);

                if (msg.sender === 'outgoing' && !msg.isRevoked) {
                    let unsendBtn = document.createElement('button');
                    unsendBtn.className = 'unsend-btn';
                    unsendBtn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Thu hồi';
                    unsendBtn.setAttribute('onclick', `unsendMessage(${msg.id})`);
                    innerContainer.appendChild(unsendBtn);
                }

                wrapper.appendChild(innerContainer);

                let infoDiv = document.createElement('div');
                infoDiv.className = 'message-info';
                infoDiv.innerHTML = `<span>${msg.time}</span>${msg.sender === 'outgoing' && !msg.isRevoked ? '<span>• Đã gửi vào nhóm</span>' : ''}`;
                wrapper.appendChild(infoDiv);

                chatMessages.appendChild(wrapper);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function unsendMessage(msgId) {
            let msg = groupMessages.find(m => m.id === msgId);
            if (msg) {
                msg.isRevoked = true;
                renderMessages();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            groupMessages.push({
                id: Date.now(),
                sender: 'outgoing',
                text: text,
                time: timeString,
                isRevoked: false
            });

            input.value = "";
            renderMessages();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let mediaDataUrl = e.target.result;
                let now = new Date();
                let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                
                let fileType = file.type.startsWith('video') ? 'video' : 'image';

                groupMessages.push({
                    id: Date.now(),
                    sender: 'outgoing',
                    text: mediaDataUrl,
                    type: fileType,
                    time: timeString,
                    isRevoked: false
                });

                renderMessages();
            };
            reader.readAsDataURL(file);
            event.target.value = "";
        }

        function toggleEmojiPicker() {
            let picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const startPos = input.selectionStart;
            const endPos = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, startPos) + emoji + text.substring(endPos);
            input.focus();
            input.setSelectionRange(startPos + emoji.length, startPos + emoji.length);
        }
    </script>
</body>
</html>
