<!DOCTYPE html>
<html lang="vi" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber.Chat - Quản lý tài khoản</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050505',
                        cardBg: '#121212',
                    }
                }
            }
        }
    </script>
    <style>
        .neon-border {
            border: 1px solid rgba(234, 179, 8, 0.6);
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.2), inset 0 0 5px rgba(234, 179, 8, 0.1);
        }
        .neon-border-subtle {
            border-color: rgba(234, 179, 8, 0.3);
        }
        .neon-glow-text {
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #422006;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #eab308;
        }
    </style>
</head>
<body class="h-full bg-darkBg text-gray-100 flex overflow-hidden select-none">

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-darkBg flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-cardBg neon-border rounded-2xl p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <i class="fa-brands fa-facebook-messenger text-5xl text-yellow-400 neon-glow-text"></i>
                <h1 id="authTitle" class="text-2xl font-bold tracking-wider text-yellow-400 neon-glow-text">ĐĂNG NHẬP CYBER.CHAT</h1>
                <p class="text-xs text-yellow-500/60">Hệ thống nhắn tin bảo mật giao diện Neon</p>
            </div>

            <!-- Form Đăng Nhập -->
            <div id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TÊN ĐĂNG NHẬP</label>
                    <input type="text" id="loginUsername" placeholder="Nhập tên tài khoản..." class="w-full bg-black/60 neon-border rounded-lg px-4 py-2.5 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">MẬT KHẨU</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." class="w-full bg-black/60 neon-border rounded-lg px-4 py-2.5 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
                <button onclick="handleLogin()" class="w-full py-3 bg-yellow-500 text-black font-bold rounded-lg neon-glow-btn transition hover:bg-yellow-400 tracking-wider">ĐĂNG NHẬP</button>
                
                <p class="text-center text-xs text-yellow-500/70 pt-2">
                    Chưa có tài khoản? <span onclick="switchAuthMode('register')" class="text-yellow-400 font-semibold cursor-pointer underline hover:text-yellow-300">Đăng ký ngay</span>
                </p>
            </div>

            <!-- Form Đăng Ký -->
            <div id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TÊN HIỂN THỊ</label>
                    <input type="text" id="regName" placeholder="Nhập tên của bạn..." class="w-full bg-black/60 neon-border rounded-lg px-4 py-2.5 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TÊN ĐĂNG NHẬP</label>
                    <input type="text" id="regUsername" placeholder="Tạo tên đăng nhập..." class="w-full bg-black/60 neon-border rounded-lg px-4 py-2.5 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">MẬT KHẨU</label>
                    <input type="password" id="regPassword" placeholder="Tạo mật khẩu..." class="w-full bg-black/60 neon-border rounded-lg px-4 py-2.5 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
                <button onclick="handleRegister()" class="w-full py-3 bg-yellow-500 text-black font-bold rounded-lg neon-glow-btn transition hover:bg-yellow-400 tracking-wider">ĐĂNG KÝ</button>
                
                <p class="text-center text-xs text-yellow-500/70 pt-2">
                    Đã có tài khoản? <span onclick="switchAuthMode('login')" class="text-yellow-400 font-semibold cursor-pointer underline hover:text-yellow-300">Đăng nhập</span>
                </p>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="mainApp" class="h-full w-full flex overflow-hidden hidden">
        <!-- SIDEBAR TRÁI -->
        <div class="w-80 md:w-96 border-r border-yellow-500/35 flex flex-col h-full bg-cardBg">
            <div class="p-4 flex items-center justify-between border-b border-yellow-500/20">
                <div class="flex items-center space-x-3">
                    <div class="relative p-0.5 rounded-full neon-border">
                        <img id="currentUserAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                    </div>
                    <div>
                        <h1 id="currentUserName" class="text-sm font-bold text-yellow-300 truncate w-32"></h1>
                        <span onclick="handleLogout()" class="text-xs text-red-400 cursor-pointer hover:underline"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <!-- NÚT MỞ BẢNG QUẢN LÍ TÀI KHOẢN -->
                    <button onclick="openAccountModal()" class="w-9 h-9 rounded-full bg-black/45 neon-border flex items-center justify-center text-yellow-400 neon-glow-btn transition" title="Quản lí tài khoản"><i class="fa-solid fa-pen-to-square text-sm"></i></button>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="px-4 py-3">
                <div class="bg-black/60 neon-border rounded-full flex items-center px-3 py-2 space-x-2">
                    <i class="fa-solid fa-magnifying-glass text-yellow-500/70 text-sm"></i>
                    <input type="text" id="searchContact" placeholder="Tìm kiếm cuộc trò chuyện..." class="bg-transparent border-none outline-none text-sm w-full placeholder-yellow-500/40 text-yellow-200">
                </div>
            </div>

            <!-- Danh sách đoạn chat -->
            <div id="contactList" class="flex-1 overflow-y-auto px-2 space-y-1 my-1"></div>
        </div>

        <!-- KHUNG CHAT CHÍNH -->
        <div id="chatArea" class="flex-1 flex flex-col h-full bg-darkBg relative">
            <div id="noChatSelected" class="flex-1 flex flex-col items-center justify-center text-yellow-500/50">
                <i class="fa-brands fa-facebook-messenger text-6xl mb-3 text-yellow-400 neon-glow-text animate-pulse"></i>
                <p class="text-lg font-medium tracking-wide">Chọn một cuộc trò chuyện để bắt đầu kết nối</p>
            </div>

            <div id="activeChatContainer" class="flex-1 flex flex-col h-full hidden">
                <div class="px-4 py-3 border-b border-yellow-500/30 flex items-center justify-between bg-cardBg shadow-md">
                    <div class="flex items-center space-x-3 cursor-pointer">
                        <div class="relative p-0.5 rounded-full neon-border">
                            <img id="activeChatAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-yellow-400 border-2 border-black rounded-full shadow-[0_0_8px_#eab308]"></span>
                        </div>
                        <div>
                            <h3 id="activeChatName" class="font-semibold text-sm text-yellow-300"></h3>
                            <p class="text-xs text-yellow-500/70">Trực tuyến</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-yellow-400">
                        <button onclick="toggleSidebarRight()" class="w-9 h-9 rounded-full bg-black/40 neon-border flex items-center justify-center hover:bg-yellow-500/20 transition"><i class="fa-solid fa-circle-info text-sm"></i></button>
                    </div>
                </div>

                <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-darkBg"></div>

                <div class="p-3 border-t border-yellow-500/30 flex items-center space-x-2 bg-cardBg">
                    <div class="flex items-center space-x-2 text-yellow-400">
                        <label class="w-9 h-9 rounded-full bg-black/40 neon-border flex items-center justify-center cursor-pointer hover:bg-yellow-500/20 transition">
                            <i class="fa-solid fa-circle-plus text-sm"></i>
                            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="sendImage(event)">
                        </label>
                    </div>

                    <div class="flex-1 bg-black/60 neon-border rounded-full flex items-center px-4 py-2 space-x-2">
                        <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." class="bg-transparent border-none outline-none text-sm w-full placeholder-yellow-500/40 text-yellow-100" onkeypress="handleKeyPress(event)">
                    </div>

                    <button id="sendBtn" onclick="sendMessage()" class="text-yellow-400 text-xl w-10 h-10 rounded-full bg-black/50 neon-border flex items-center justify-center hover:bg-yellow-400 hover:text-black transition shadow-[0_0_10px_rgba(234,179,8,0.3)]">
                        <i id="sendIcon" class="fa-solid fa-thumbs-up text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SIDEBAR PHẢI: THÔNG TIN CHI TIẾT -->
        <div id="rightSidebar" class="w-80 border-l border-yellow-500/30 flex flex-col h-full bg-cardBg hidden">
            <div class="p-4 border-b border-yellow-500/20 flex justify-between items-center">
                <span class="font-semibold text-sm text-yellow-400">Thông tin chi tiết</span>
                <button onclick="toggleSidebarRight()" class="text-yellow-500 hover:text-yellow-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex flex-col items-center p-6 border-b border-yellow-500/20">
                <div class="p-1 rounded-full neon-border mb-3 shadow-[0_0_15px_rgba(234,179,8,0.3)]">
                    <img id="infoAvatar" src="" class="w-20 h-20 rounded-full object-cover">
                </div>
                <h3 id="infoName" class="font-bold text-lg text-yellow-300"></h3>
                <p class="text-xs text-yellow-400 font-medium mt-1">● Hoạt động hệ thống</p>
            </div>
            <div class="p-4">
                <button onclick="clearCurrentChat()" class="w-full py-2.5 bg-red-950/40 border border-red-500/50 text-red-400 rounded-lg text-sm font-medium hover:bg-red-900/40 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Xóa cuộc trò chuyện</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL QUẢN LÍ TÀI KHOẢN -->
    <div id="accountModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md bg-cardBg neon-border rounded-2xl p-6 space-y-5 shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-yellow-500/20 pb-3">
                <h3 class="font-bold text-lg text-yellow-400 neon-glow-text">QUẢN LÍ TÀI KHOẢN</h3>
                <button onclick="closeAccountModal()" class="text-yellow-500 hover:text-yellow-300"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-4">
                <!-- Đổi Avatar -->
                <div class="flex flex-col items-center space-y-2">
                    <div class="relative p-1 rounded-full neon-border">
                        <img id="modalAvatarPreview" src="" class="w-20 h-20 rounded-full object-cover">
                    </div>
                    <label class="text-xs bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-yellow-500/30 transition">
                        <i class="fa-solid fa-camera"></i> Đổi ảnh đại diện
                        <input type="file" id="modalAvatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                    </label>
                </div>

                <!-- Đổi Tên Hiển Thị -->
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TÊN HIỂN THỊ</label>
                    <input type="text" id="modalNameInput" class="w-full bg-black/60 neon-border rounded-lg px-3 py-2 text-sm text-yellow-200 outline-none">
                </div>

                <!-- Đổi Tên Đăng Nhập -->
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TÊN ĐĂNG NHẬP</label>
                    <input type="text" id="modalUsernameInput" class="w-full bg-black/60 neon-border rounded-lg px-3 py-2 text-sm text-yellow-200 outline-none">
                </div>

                <!-- Đổi Mật Khẩu -->
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">MẬT KHẨU MỚI (để trống nếu không đổi)</label>
                    <input type="password" id="modalPasswordInput" placeholder="Nhập mật khẩu mới..." class="w-full bg-black/60 neon-border rounded-lg px-3 py-2 text-sm text-yellow-200 outline-none placeholder-yellow-500/30">
                </div>
            </div>

            <div class="flex space-x-3 pt-2">
                <button onclick="closeAccountModal()" class="flex-1 py-2.5 bg-black/40 border border-yellow-500/30 text-yellow-400 rounded-lg text-sm font-medium hover:bg-yellow-500/10 transition">Hủy</button>
                <button onclick="saveAccountChanges()" class="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-lg neon-glow-btn transition hover:bg-yellow-400 text-sm">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let users = JSON.parse(localStorage.getItem('neon_users')) || [
            { id: '1', username: 'admin', password: '123', name: 'Quản trị viên', avatar: 'https://i.pravatar.cc/150?img=12' },
            { id: '2', username: 'hacker', password: '123', name: 'Hacker Neo', avatar: 'https://i.pravatar.cc/150?img=32' }
        ];

        let currentUser = JSON.parse(localStorage.getItem('neon_current_user')) || null;
        let activeContactId = null;
        let messages = JSON.parse(localStorage.getItem('neon_messages')) || {};
        let tempNewAvatar = '';

        window.onload = function() {
            if (currentUser) appInit();
        }

        function switchAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'ĐĂNG KÝ TÀI KHOẢN';
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'ĐĂNG NHẬP CYBER.CHAT';
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if(!name || !username || !password) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }

            if(users.find(u => u.username === username)) {
                alert('Tên đăng nhập đã tồn tại!');
                return;
            }

            users.push({
                id: Date.now().toString(),
                username,
                password,
                name,
                avatar: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`
            });
            localStorage.setItem('neon_users', JSON.stringify(users));
            alert('Đăng ký thành công!');
            switchAuthMode('login');
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const user = users.find(u => u.username === username && u.password === password);
            if(!user) {
                alert('Sai tên đăng nhập hoặc mật khẩu!');
                return;
            }

            currentUser = user;
            localStorage.setItem('neon_current_user', JSON.stringify(currentUser));
            appInit();
        }

        function handleLogout() {
            localStorage.removeItem('neon_current_user');
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function appInit() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('currentUserAvatar').src = currentUser.avatar;
            document.getElementById('currentUserName').innerText = currentUser.name;
            renderContacts();
        }

        // --- CÁC HÀM QUẢN LÍ TÀI KHOẢN ---
        function openAccountModal() {
            document.getElementById('modalAvatarPreview').src = currentUser.avatar;
            document.getElementById('modalNameInput').value = currentUser.name;
            document.getElementById('modalUsernameInput').value = currentUser.username;
            document.getElementById('modalPasswordInput').value = '';
            tempNewAvatar = currentUser.avatar;
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function closeAccountModal() {
            document.getElementById('accountModal').classList.add('hidden');
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempNewAvatar = e.target.result;
                document.getElementById('modalAvatarPreview').src = tempNewAvatar;
            }
            reader.readAsDataURL(file);
        }

        function saveAccountChanges() {
            const newName = document.getElementById('modalNameInput').value.trim();
            const newUsername = document.getElementById('modalUsernameInput').value.trim();
            const newPassword = document.getElementById('modalPasswordInput').value.trim();

            if(!newName || !newUsername) {
                alert('Tên hiển thị và tên đăng nhập không được để trống!');
                return;
            }

            // Kiểm tra trùng username với user khác
            const duplicate = users.find(u => u.username === newUsername && u.id !== currentUser.id);
            if(duplicate) {
                alert('Tên đăng nhập này đã có người sử dụng!');
                return;
            }

            currentUser.name = newName;
            currentUser.username = newUsername;
            currentUser.avatar = tempNewAvatar;
            if(newPassword) {
                currentUser.password = newPassword;
            }

            // Cập nhật trong mảng users tổng
            const index = users.findIndex(u => u.id === currentUser.id);
            if(index !== -1) {
                users[index] = currentUser;
            }

            localStorage.setItem('neon_users', JSON.stringify(users));
            localStorage.setItem('neon_current_user', JSON.stringify(currentUser));

            appInit();
            closeAccountModal();
            alert('Cập nhật tài khoản thành công!');
        }

        function renderContacts() {
            const listEl = document.getElementById('contactList');
            listEl.innerHTML = '';
            
            users.filter(u => u.id !== currentUser.id).forEach(contact => {
                const chatKey = [currentUser.id, contact.id].sort().join('_');
                const chatLog = messages[chatKey] || [];
                const lastMsg = chatLog.length > 0 ? chatLog[chatLog.length - 1].text : 'Chưa có thông điệp';
                const isSelected = activeContactId === contact.id;

                const div = document.createElement('div');
                div.className = `flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${isSelected ? 'bg-yellow-500/15 neon-border-subtle border' : 'hover:bg-yellow-500/5'}`;
                div.onclick = () => selectContact(contact.id);
                div.innerHTML = `
                    <div class="relative p-0.5 rounded-full ${isSelected ? 'neon-border' : ''}">
                        <img src="${contact.avatar}" class="w-12 h-12 rounded-full object-cover">
                        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-yellow-400 border-2 border-black rounded-full shadow-[0_0_5px_#eab308]"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-sm truncate text-yellow-200">${contact.name}</h4>
                        <p class="text-xs text-yellow-500/60 truncate mt-0.5">${lastMsg}</p>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function selectContact(id) {
            activeContactId = id;
            const contact = users.find(u => u.id === id);

            document.getElementById('noChatSelected').classList.add('hidden');
            document.getElementById('activeChatContainer').classList.remove('hidden');

            document.getElementById('activeChatName').innerText = contact.name;
            document.getElementById('activeChatAvatar').src = contact.avatar;
            document.getElementById('infoName').innerText = contact.name;
            document.getElementById('infoAvatar').src = contact.avatar;

            renderContacts();
            loadMessages();
        }

        function loadMessages() {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            
            const chatKey = [currentUser.id, activeContactId].sort().join('_');
            const chatLog = messages[chatKey] || [];

            chatLog.forEach(msg => {
                const isMe = msg.sender === currentUser.id;
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} items-end space-x-2`;

                let contentHtml = '';
                if(msg.type === 'image') {
                    contentHtml = `<img src="${msg.text}" class="max-w-xs rounded-2xl neon-border shadow-md">`;
                } else if(msg.text === '👍') {
                    contentHtml = `<span class="text-4xl filter drop-shadow-[0_0_8px_#eab308]">👍</span>`;
                } else {
                    contentHtml = `<div class="px-4 py-2 rounded-2xl max-w-sm text-sm ${isMe ? 'bg-yellow-500 text-black font-medium rounded-br-xs shadow-[0_0_10px_rgba(234,179,8,0.4)]' : 'bg-cardBg border border-yellow-500/30 text-yellow-100 rounded-bl-xs'}">${msg.text}</div>`;
                }

                msgDiv.innerHTML = `<div>${contentHtml}</div>`;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if(!activeContactId) return;

            if(!text) text = '👍';

            const chatKey = [currentUser.id, activeContactId].sort().join('_');
            if(!messages[chatKey]) messages[chatKey] = [];
            
            messages[chatKey].push({ sender: currentUser.id, text: text });
            localStorage.setItem('neon_messages', JSON.stringify(messages));
            input.value = '';
            
            loadMessages();
            renderContacts();
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        const inputField = document.getElementById('messageInput');
        inputField.addEventListener('input', (e) => {
            const sendIcon = document.getElementById('sendIcon');
            sendIcon.className = e.target.value.trim().length > 0 ? "fa-solid fa-paper-plane text-sm" : "fa-solid fa-thumbs-up text-sm";
        });

        function toggleSidebarRight() {
            document.getElementById('rightSidebar').classList.toggle('hidden');
        }

        function clearCurrentChat() {
            if(confirm('Xóa toàn bộ cuộc trò chuyện này?')) {
                const chatKey = [currentUser.id, activeContactId].sort().join('_');
                delete messages[chatKey];
                localStorage.setItem('neon_messages', JSON.stringify(messages));
                loadMessages();
                renderContacts();
            }
        }
    </script>
</body>
</html>
