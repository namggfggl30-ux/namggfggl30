<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Neon Vàng & Đen - Có Danh Sách Thành Viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-layout {
            width: 100%;
            max-width: 1100px;
            height: 95vh;
            display: flex;
            background: #121212;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            overflow: hidden;
        }

        /* Khung chat chính */
        .chat-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        /* Thanh thành viên bên phải */
        .sidebar {
            width: 260px;
            height: 100%;
            background-color: #161616;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .member-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            background: #0b0b0b;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .member-item:hover {
            border-color: #ffd700;
        }

        .member-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #000;
            color: #ffd700;
            border: 1px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }

        .member-info h4 {
            font-size: 14px;
            color: #ffd700;
        }

        .member-info span {
            font-size: 11px;
            color: #888;
        }

        /* Header */
        .chat-header {
            padding: 18px 25px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #000;
            color: #ffd700;
            border: 1px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .chat-user-info h3 {
            font-size: 18px;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .chat-user-info span {
            font-size: 13px;
            color: #888;
        }

        /* Danh sách tin nhắn */
        .chat-messages {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #121212;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.incoming {
            background-color: #1e1e1e;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: #ffd700;
            color: #000000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .message img, .message video {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid #ffd700;
        }

        .message .custom-emoji-img {
            width: 48px;
            height: 48px;
            vertical-align: middle;
            margin: 0;
            border: none;
            border-radius: 6px;
            display: inline-block;
        }

        /* Khu vực nhập tin nhắn */
        .chat-input-area {
            padding: 15px 25px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .chat-input-area button.action-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
        }

        .chat-input-area button.action-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            background-color: #0b0b0b;
            border: 1px solid #444;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
            color: #ffd700;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .send-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        /* Bảng chọn Emoji (Nền đen viền vàng neon) */
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            left: 25px;
            background: #121212;
            border: 2px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            display: none;
            padding: 12px;
            width: 260px;
            max-height: 220px;
            overflow-y: auto;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 100;
        }

        .emoji-picker.active {
            display: flex;
        }

        /* Các ô chứa emoji: Nền đen, viền vàng neon */
        .emoji-item {
            cursor: pointer;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #0b0b0b;
            border: 1px solid #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
            transition: 0.2s;
        }

        .emoji-item:hover {
            background: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .emoji-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Nút dấu cộng [+] tải emoji: Nền đen, viền vàng neon */
        .add-emoji-btn {
            background: #0b0b0b;
            border: 2px dashed #ffd700;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
            transition: 0.2s;
        }

        .add-emoji-btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-avatar">AI</div>
                <div class="chat-user-info">
                    <h3>Trợ Lý Neon</h3>
                    <span>Sẵn sàng kết nối</span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">Đã tích hợp thêm danh sách thành viên ở bên phải! Giao diện chuẩn Neon Vàng & Đen. ⚡</div>
            </div>

            <div class="emoji-picker" id="emojiPicker">
                <label for="customEmojiInput" class="add-emoji-btn" title="Tải emoji mới từ máy">
                    <i class="fa-solid fa-plus"></i>
                </label>
                <input type="file" id="customEmojiInput" accept="image/*" style="display: none;" onchange="handleCustomEmojiUpload(event)">
            </div>

            <div class="chat-input-area">
                <label for="mediaInput" class="action-btn" title="Gửi ảnh hoặc video">
                    <i class="fa-regular fa-image"></i>
                </label>
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">

                <button class="action-btn" id="emojiBtn" title="Bảng emoji của bạn">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="checkEnter(event)">

                <button class="send-btn" onclick="sendMessage()" title="Gửi">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">Thành viên (4)</div>
            <div class="member-list">
                <div class="member-item">
                    <div class="member-avatar">AI</div>
                    <div class="member-info">
                        <h4>Trợ Lý Neon</h4>
                        <span>Đang hoạt động</span>
                    </div>
                </div>
                <div class="member-item">
                    <div class="member-avatar">TK</div>
                    <div class="member-info">
                        <h4>Thanh Khách</h4>
                        <span>Trực tuyến</span>
                    </div>
                </div>
                <div class="member-item">
                    <div class="member-avatar">NV</div>
                    <div class="member-info">
                        <h4>Người Vô Danh</h4>
                        <span>Vừa mới truy cập</span>
                    </div>
                </div>
                <div class="member-item">
                    <div class="member-avatar">VIP</div>
                    <div class="member-info">
                        <h4>Thành Viên VIP</h4>
                        <span>Đang ngoại tuyến</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiBtn = document.getElementById('emojiBtn');

        // Bật/tắt bảng emoji
        emojiBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            emojiPicker.classList.toggle('active');
        });

        // Ẩn bảng emoji khi click ra ngoài
        document.addEventListener('click', (event) => {
            if (!emojiPicker.contains(event.target) && event.target !== emojiBtn) {
                emojiPicker.classList.remove('active');
            }
        });

        // Tải ảnh từ máy và thêm vào bảng emoji
        function handleCustomEmojiUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            
            const newEmojiItem = document.createElement('div');
            newEmojiItem.classList.add('emoji-item');
            
            const img = document.createElement('img');
            img.src = fileURL;
            newEmojiItem.appendChild(img);

            // Khi bấm vào emoji trong bảng -> TỰ ĐỘNG GỬI LUÔN
            newEmojiItem.onclick = function() {
                const emojiHTML = `<img src="${fileURL}" class="custom-emoji-img">`;
                appendMessage(emojiHTML, 'outgoing', 'custom-html');
                emojiPicker.classList.remove('active');
                
                setTimeout(() => {
                    appendMessage('Hệ thống đã nhận emoji!', 'incoming', 'text');
                }, 1000);
            };

            emojiPicker.appendChild(newEmojiItem);
            event.target.value = '';
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            appendMessage(text, 'outgoing', 'text');
            messageInput.value = '';
            
            setTimeout(() => {
                appendMessage('Hệ thống đã nhận: "' + text + '"', 'incoming', 'text');
            }, 1000);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            const fileType = file.type;

            if (fileType.startsWith('image/')) {
                appendMessage(fileURL, 'outgoing', 'image');
            } else if (fileType.startsWith('video/')) {
                appendMessage(fileURL, 'outgoing', 'video');
            }

            event.target.value = '';
        }

        function appendMessage(content, sender, type) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            if (type === 'text') {
                messageDiv.textContent = content;
            } else if (type === 'custom-html') {
                messageDiv.innerHTML = content;
            } else if (type === 'image') {
                const img = document.createElement('img');
                img.src = content;
                messageDiv.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = content;
                video.controls = true;
                messageDiv.appendChild(video);
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
