<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Neon Vàng & Đen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #121212;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 15px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000;
            color: #ffd700;
            border: 1px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .chat-user-info h3 {
            font-size: 16px;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .chat-user-info span {
            font-size: 12px;
            color: #888;
        }

        /* Danh sách tin nhắn */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #121212;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.incoming {
            background-color: #1e1e1e;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: #ffd700;
            color: #000000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid #ffd700;
        }

        /* Khu vực nhập tin nhắn */
        .chat-input-area {
            padding: 12px 15px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .chat-input-area button.action-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
        }

        .chat-input-area button.action-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            background-color: #0b0b0b;
            border: 1px solid #444;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            color: #ffd700;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .send-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        /* Bảng chọn Emoji */
        .emoji-picker {
            position: absolute;
            bottom: 65px;
            left: 15px;
            background: #1a1a1a;
            border: 1px solid #ffd700;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            display: none;
            padding: 8px;
            gap: 5px;
            flex-wrap: wrap;
            width: 200px;
        }

        .emoji-picker.active {
            display: flex;
        }

        .emoji-item {
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .emoji-item:hover {
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-avatar">AI</div>
            <div class="chat-user-info">
                <h3>Trợ Lý Neon</h3>
                <span>Sẵn sàng kết nối</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message incoming">Chào mừng bạn đến với không gian Neon Vàng-Đen! ⚡</div>
        </div>

        <div class="emoji-picker" id="emojiPicker">
            <span class="emoji-item" onclick="addEmoji('⚡')">⚡</span>
            <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji-item" onclick="addEmoji('💀')">💀</span>
            <span class="emoji-item" onclick="addEmoji('😎')">😎</span>
            <span class="emoji-item" onclick="addEmoji('💛')">💛</span>
            <span class="emoji-item" onclick="addEmoji('🚀')">🚀</span>
            <span class="emoji-item" onclick="addEmoji('✨')">✨</span>
            <span class="emoji-item" onclick="addEmoji('💎')">💎</span>
        </div>

        <div class="chat-input-area">
            <label for="mediaInput" class="action-btn" title="Gửi ảnh hoặc video">
                <i class="fa-regular fa-image"></i>
            </label>
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">

            <button class="action-btn" onclick="toggleEmojiPicker()" title="Chọn biểu tượng cảm xúc">
                <i class="fa-regular fa-face-smile"></i>
            </button>

            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="checkEnter(event)">

            <button class="send-btn" onclick="sendMessage()" title="Gửi">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const emojiPicker = document.getElementById('emojiPicker');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            appendMessage(text, 'outgoing', 'text');
            messageInput.value = '';
            
            setTimeout(() => {
                appendMessage('Hệ thống đã nhận: "' + text + '"', 'incoming', 'text');
            }, 1000);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function toggleEmojiPicker() {
            emojiPicker.classList.toggle('active');
        }

        function addEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
            emojiPicker.classList.remove('active');
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            const fileType = file.type;

            if (fileType.startsWith('image/')) {
                appendMessage(fileURL, 'outgoing', 'image');
            } else if (fileType.startsWith('video/')) {
                appendMessage(fileURL, 'outgoing', 'video');
            }

            event.target.value = '';
        }

        function appendMessage(content, sender, type) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            if (type === 'text') {
                messageDiv.textContent = content;
            } else if (type === 'image') {
                const img = document.createElement('img');
                img.src = content;
                messageDiv.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = content;
                video.controls = true;
                messageDiv.appendChild(video);
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
