<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Messenger - Đăng Nhập & Đăng Ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #0a0a0a;
            --chat-bg: #121212;
            --neon-yellow: #ffd700;
            --neon-glow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2);
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --bubble-me: #2a2500;
            --bubble-other: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Auth Screen Styles */
        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--chat-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            box-shadow: var(--neon-glow);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h1 {
            color: var(--neon-yellow);
            font-size: 1.8rem;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--neon-yellow);
            color: var(--bg-black);
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .auth-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .auth-switch {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--neon-yellow);
            cursor: pointer;
            font-weight: 500;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        /* Messenger App Styles */
        .messenger-container {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            background-color: var(--chat-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            box-shadow: var(--neon-glow);
            display: none; /* Ẩn đi khi chưa đăng nhập */
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            border-right: 1px solid #332d00;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #221e00;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .sidebar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sidebar-actions i {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .sidebar-actions i:hover {
            background-color: #221e00;
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .search-box {
            padding: 12px 15px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #141414;
        }

        .contact-item:hover {
            background-color: #1c1900;
        }

        .contact-item.active {
            background-color: #262100;
            border-left: 4px solid var(--neon-yellow);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #222;
            border: 1px solid var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--neon-yellow);
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #00ff00;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--bg-black);
            box-shadow: 0 0 5px #00ff00;
        }

        .contact-info {
            overflow: hidden;
            flex: 1;
        }

        .contact-info h4 {
            font-size: 0.95rem;
            margin-bottom: 3px;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #221e00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
        }

        .chat-header-info h3 {
            font-size: 1rem;
            color: var(--text-main);
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: var(--neon-yellow);
        }

        .chat-header-icons i {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            margin-left: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-header-icons i:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .message-wrapper.incoming {
            align-items: flex-start;
        }

        .message-wrapper.outgoing {
            align-items: flex-end;
        }

        .message-container-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 75%;
        }

        .message-wrapper.incoming .message-container-inner {
            flex-direction: row;
        }

        .message-wrapper.outgoing .message-container-inner {
            flex-direction: row-reverse;
        }

        .message {
            padding: 10px 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.incoming {
            background-color: var(--bubble-other);
            color: var(--text-main);
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: var(--bubble-me);
            color: var(--text-main);
            border: 1px solid #594d00;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.1);
        }

        .message.revoked {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed #444;
            font-style: italic;
        }

        .message img, .message video {
            max-width: 240px;
            border-radius: 8px;
            display: block;
        }

        .unsend-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }

        .message-wrapper.outgoing:hover .unsend-btn {
            opacity: 1;
        }

        .unsend-btn:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .message-info {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            gap: 6px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-top: 1px solid #221e00;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .chat-input-area .tools {
            display: flex;
            gap: 12px;
        }

        .chat-input-area .tools i {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-area .tools i:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Emoji Picker Popup */
        .picker-popup {
            position: absolute;
            bottom: 75px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid var(--neon-yellow);
            border-radius: 12px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            box-shadow: var(--neon-glow);
            z-index: 100;
            max-width: 280px;
        }

        .picker-popup span {
            font-size: 1.4rem;
            cursor: pointer;
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .picker-popup span:hover {
            background: #332d00;
            transform: scale(1.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #332d00; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-yellow); }
    </style>
</head>
<body>

    <div class="auth-container" id="authBox">
        <div class="auth-header">
            <h1 id="authTitle">Đăng Nhập</h1>
            <p id="authSubtitle">Chào mừng bạn quay trở lại với Neon Messenger</p>
        </div>
        <div class="auth-form">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label>Tên hiển thị</label>
                <input type="text" id="regName" placeholder="Nhập tên của bạn...">
            </div>
            <div class="input-group">
                <label>Tên tài khoản hoặc Email</label>
                <input type="text" id="authUsername" placeholder="Nhập tài khoản...">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="authPassword" placeholder="Nhập mật khẩu...">
            </div>
            <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">Đăng Nhập</button>
            <div class="auth-switch" id="authSwitchText">
                Chưa có tài khoản? <span onclick="toggleAuthMode()">Đăng ký ngay</span>
            </div>
        </div>
    </div>

    <div class="messenger-container" id="messengerBox">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Thành viên</h2>
                <div class="sidebar-actions">
                    <i class="fa-solid fa-user-plus" title="Thêm thành viên mới" onclick="openNewChatModal()"></i>
                    <i class="fa-solid fa-right-from-bracket" title="Đăng xuất" onclick="logout()"></i>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchContact" placeholder="Tìm kiếm thành viên..." onkeyup="filterContacts()">
            </div>
            <div class="contact-list" id="contactList">
                </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar" id="currentAvatar" style="width: 38px; height: 38px; font-size: 0.85rem; margin-right: 12px;">A</div>
                    <div class="chat-header-info">
                        <h3 id="currentChatName">Admin Neon</h3>
                        <span id="currentChatStatus">Đang hoạt động</span>
                    </div>
                </div>
                <div class="chat-header-icons">
                    <i class="fa-solid fa-circle-info" onclick="alert('Tính năng thông tin thành viên đang được cập nhật!')"></i>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                </div>

            <div class="picker-popup" id="emojiPicker">
                <span onclick="insertEmoji('😀')">😀</span>
                <span onclick="insertEmoji('😂')">😂</span>
                <span onclick="insertEmoji('😍')">😍</span>
                <span onclick="insertEmoji('😎')">😎</span>
                <span onclick="insertEmoji('🤔')">🤔</span>
                <span onclick="insertEmoji('👍')">👍</span>
                <span onclick="insertEmoji('❤️')">❤️</span>
                <span onclick="insertEmoji('🔥')">🔥</span>
                <span onclick="insertEmoji('⭐')">⭐</span>
                <span onclick="insertEmoji('🎉')">🎉</span>
                <span onclick="insertEmoji('🚀')">🚀</span>
                <span onclick="insertEmoji('⚡')">⚡</span>
                <span onclick="insertEmoji('💡')">💡</span>
                <span onclick="insertEmoji('✨')">✨</span>
                <span onclick="insertEmoji('🎯')">🎯</span>
                <span onclick="insertEmoji('💻')">💻</span>
                <span onclick="insertEmoji('🍀')">🍀</span>
                <span onclick="insertEmoji('🍻')">🍻</span>
            </div>

            <div class="chat-input-area">
                <div class="tools">
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">
                    <i class="fa-solid fa-circle-plus" title="Tải ảnh hoặc video từ máy" onclick="document.getElementById('mediaInput').click()"></i>
                    <i class="fa-regular fa-face-smile" title="Chọn Icon" onclick="toggleEmojiPicker()"></i>
                </div>
                <input type="text" id="messageInput" placeholder="Nhắn tin..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('authSwitchText');
            const nameGroup = document.getElementById('nameGroup');

            if (isRegisterMode) {
                title.innerText = "Đăng Ký";
                subtitle.innerText = "Tạo tài khoản mới để trải nghiệm Neon Messenger";
                submitBtn.innerText = "Đăng Ký Ngay";
                switchText.innerHTML = 'Đã có tài khoản? <span onclick="toggleAuthMode()">Đăng nhập</span>';
                nameGroup.style.display = "flex";
            } else {
                title.innerText = "Đăng Nhập";
                subtitle.innerText = "Chào mừng bạn quay trở lại với Neon Messenger";
                submitBtn.innerText = "Đăng Nhập";
                switchText.innerHTML = 'Chưa có tài khoản? <span onclick="toggleAuthMode()">Đăng ký ngay</span>';
                nameGroup.style.display = "none";
            }
        }

        function handleAuth() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();

            if (!user || !pass) {
                alert("Vui lòng điền đầy đủ thông tin tài khoản và mật khẩu!");
                return;
            }

            if (isRegisterMode) {
                const name = document.getElementById('regName').value.trim();
                if (!name) {
                    alert("Vui lòng nhập tên hiển thị của bạn!");
                    return;
                }
                alert("Đăng ký thành công! Hãy đăng nhập lại.");
                toggleAuthMode();
            } else {
                // Đăng nhập thành công -> Chuyển sang màn hình chat
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('messengerBox').style.display = 'flex';
                renderContacts();
                renderMessages();
            }
        }

        function logout() {
            document.getElementById('messengerBox').style.display = 'none';
            document.getElementById('authBox').style.display = 'flex';
            document.getElementById('authUsername').value = "";
            document.getElementById('authPassword').value = "";
        }

        // --- CODE XỬ LÝ NHẮN TIN, THU HỒI, MEDIA VÀ ICON GIỮ NGUYÊN ---
        let chatsData = {
            1: {
                name: "Admin Neon",
                status: "Đang hoạt động",
                avatar: "A",
                messages: [
                    { id: 101, sender: "incoming", text: "Chào mừng bạn đăng nhập thành công vào hệ thống! 🎬📸", time: "10:40", isRevoked: false },
                    { id: 102, sender: "outgoing", text: "Tuyệt vời quá đi! 🔥", time: "10:41", isRevoked: false }
                ]
            },
            2: {
                name: "Bot AI Cyber",
                status: "Hoạt động 5 phút trước",
                avatar: "B",
                messages: [
                    { id: 201, sender: "incoming", text: "Hệ thống Cyber AI sẵn sàng tiếp nhận media từ bạn. 🤖✨", time: "09:15", isRevoked: false }
                ]
            }
        };

        let currentChatId = 1;

        function renderContacts() {
            const contactList = document.getElementById('contactList');
            contactList.innerHTML = "";
            
            for (let id in chatsData) {
                let chat = chatsData[id];
                let lastMsgObj = chat.messages[chat.messages.length - 1];
                let lastText = "";
                if (lastMsgObj) {
                    if (lastMsgObj.isRevoked) lastText = "Tin nhắn đã được thu hồi";
                    else if (lastMsgObj.type === 'image') lastText = "[Hình ảnh]";
                    else if (lastMsgObj.type === 'video') lastText = "[Video]";
                    else lastText = lastMsgObj.text;
                }
                
                let div = document.createElement('div');
                div.classList.add('contact-item');
                if (id == currentChatId) div.classList.add('active');
                div.setAttribute('onclick', `switchChat(${id})`);
                div.innerHTML = `
                    <div class="avatar">${chat.avatar}<div class="status-dot"></div></div>
                    <div class="contact-info">
                        <h4>${chat.name}</h4>
                        <p>${lastText}</p>
                    </div>
                `;
                contactList.appendChild(div);
            }
        }

        function switchChat(id) {
            currentChatId = id;
            let chat = chatsData[id];
            
            document.getElementById('currentChatName').innerText = chat.name;
            document.getElementById('currentChatStatus').innerText = chat.status;
            document.getElementById('currentAvatar').innerText = chat.avatar;
            
            renderContacts();
            renderMessages();
        }

        function renderMessages() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = "";
            
            let messages = chatsData[currentChatId].messages;
            messages.forEach(msg => {
                let wrapper = document.createElement('div');
                wrapper.classList.add('message-wrapper', msg.sender);
                
                let innerContainer = document.createElement('div');
                innerContainer.classList.add('message-container-inner');

                let msgBox = document.createElement('div');
                
                if (msg.isRevoked) {
                    msgBox.className = "message revoked";
                    msgBox.innerText = "Tin nhắn đã được thu hồi";
                } else {
                    msgBox.className = `message ${msg.sender}`;
                    if(msg.type === 'image') {
                        msgBox.innerHTML = `<img src="${msg.text}" alt="Uploaded Image">`;
                    } else if(msg.type === 'video') {
                        msgBox.innerHTML = `<video src="${msg.text}" controls></video>`;
                    } else {
                        msgBox.innerText = msg.text;
                    }
                }

                innerContainer.appendChild(msgBox);

                if (msg.sender === 'outgoing' && !msg.isRevoked) {
                    let unsendBtn = document.createElement('button');
                    unsendBtn.className = 'unsend-btn';
                    unsendBtn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Thu hồi';
                    unsendBtn.setAttribute('onclick', `unsendMessage(${msg.id})`);
                    innerContainer.appendChild(unsendBtn);
                }

                wrapper.appendChild(innerContainer);

                let infoDiv = document.createElement('div');
                infoDiv.className = 'message-info';
                infoDiv.innerHTML = `<span>${msg.time}</span>${msg.sender === 'outgoing' && !msg.isRevoked ? '<span>• Đã xem</span>' : ''}`;
                wrapper.appendChild(infoDiv);

                chatMessages.appendChild(wrapper);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function unsendMessage(msgId) {
            let messages = chatsData[currentChatId].messages;
            let msg = messages.find(m => m.id === msgId);
            if (msg) {
                msg.isRevoked = true;
                renderMessages();
                renderContacts();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chatsData[currentChatId].messages.push({
                id: Date.now(),
                sender: 'outgoing',
                text: text,
                time: timeString,
                isRevoked: false
            });

            input.value = "";
            renderMessages();
            renderContacts();

            setTimeout(() => {
                chatsData[currentChatId].messages.push({
                    id: Date.now() + 1,
                    sender: 'incoming',
                    text: "Đã nhận được tin nhắn: \"" + text + "\"",
                    time: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0'),
                    isRevoked: false
                });
                renderMessages();
                renderContacts();
            }, 1500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let mediaDataUrl = e.target.result;
                let now = new Date();
                let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                
                let fileType = file.type.startsWith('video') ? 'video' : 'image';

                chatsData[currentChatId].messages.push({
                    id: Date.now(),
                    sender: 'outgoing',
                    text: mediaDataUrl,
                    type: fileType,
                    time: timeString,
                    isRevoked: false
                });

                renderMessages();
                renderContacts();
            };
            reader.readAsDataURL(file);
            event.target.value = "";
        }

        function toggleEmojiPicker() {
            let picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const startPos = input.selectionStart;
            const endPos = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, startPos) + emoji + text.substring(endPos);
            input.focus();
            input.setSelectionRange(startPos + emoji.length, startPos + emoji.length);
        }

        function openNewChatModal() {
            let friendName = prompt("Nhập tên thành viên mới muốn thêm:");
            if(!friendName) return;
            
            let newId = Object.keys(chatsData).length + 1;
            chatsData[newId] = {
                name: friendName,
                status: "Đang hoạt động",
                avatar: friendName.charAt(0).toUpperCase(),
                messages: [{ id: Date.now(), sender: 'incoming', text: `Xin chào, mình là ${friendName} đây! 👋`, time: 'Vừa xong', isRevoked: false }]
            };
            switchChat(newId);
        }

        function filterContacts() {
            let keyword = document.getElementById('searchContact').value.toLowerCase();
            let items = document.querySelectorAll('.contact-item');
            items.forEach(item => {
                let name = item.querySelector('h4').innerText.toLowerCase();
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
