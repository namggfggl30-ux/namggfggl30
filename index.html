<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Neon Vàng & Đen - Tự Tạo Emoji</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 95vh;
            background: #121212;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 18px 25px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #000;
            color: #ffd700;
            border: 1px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .chat-user-info h3 {
            font-size: 18px;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .chat-user-info span {
            font-size: 13px;
            color: #888;
        }

        /* Danh sách tin nhắn */
        .chat-messages {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #121212;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.incoming {
            background-color: #1e1e1e;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: #ffd700;
            color: #000000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .message img, .message video {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid #ffd700;
        }

        .message .custom-emoji-img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin: 0;
            border: none;
            border-radius: 4px;
        }

        /* Khu vực nhập tin nhắn */
        .chat-input-area {
            padding: 15px 25px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .chat-input-area button.action-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
        }

        .chat-input-area button.action-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            background-color: #0b0b0b;
            border: 1px solid #444;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
            color: #ffd700;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .send-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
        }

        /* Bảng chọn Emoji trống ban đầu */
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            left: 25px;
            background: #1a1a1a;
            border: 1px solid #ffd700;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            display: none;
            padding: 12px;
            width: 260px;
            max-height: 220px;
            overflow-y: auto;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 100;
        }

        .emoji-picker.active {
            display: flex;
        }

        .emoji-item {
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #0b0b0b;
            border: 1px solid #333;
        }

        .emoji-item:hover {
            background: #333;
            border-color: #ffd700;
        }

        .emoji-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .add-emoji-btn {
            background: #0b0b0b;
            border: 1px dashed #ffd700;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: 0.2s;
        }

        .add-emoji-btn:hover {
            background: #ffd700;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-avatar">AI</div>
            <div class="chat-user-info">
                <h3>Trợ Lý Neon</h3>
                <span>Sẵn sàng kết nối</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message incoming">Bấm nút mặt cười, sau đó bấm nút [+] trong bảng để tự tải emoji từ máy lên nhé! ⚡</div>
        </div>

        <div class="emoji-picker" id="emojiPicker">
            <label for="customEmojiInput" class="add-emoji-btn" title="Tải emoji mới từ máy">
                <i class="fa-solid fa-plus"></i>
            </label>
            <input type="file" id="customEmojiInput" accept="image/*" style="display: none;" onchange="handleCustomEmojiUpload(event)">
        </div>

        <div class="chat-input-area">
            <label for="mediaInput" class="action-btn" title="Gửi ảnh hoặc video">
                <i class="fa-regular fa-image"></i>
            </label>
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">

            <button class="action-btn" id="emojiBtn" title="Bảng emoji của bạn">
                <i class="fa-regular fa-face-smile"></i>
            </button>

            <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="checkEnter(event)">

            <button class="send-btn" onclick="sendMessage()" title="Gửi">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
