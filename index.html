<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Messenger - Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #0a0a0a;
            --chat-bg: #121212;
            --neon-yellow: #ffd700;
            --neon-glow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2);
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --bubble-me: #2a2500;
            --bubble-other: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .messenger-container {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            background-color: var(--chat-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            box-shadow: var(--neon-glow);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            border-right: 1px solid #332d00;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #221e00;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .sidebar-actions i {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .sidebar-actions i:hover {
            background-color: #221e00;
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .search-box {
            padding: 12px 15px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #141414;
        }

        .contact-item:hover {
            background-color: #1c1900;
        }

        .contact-item.active {
            background-color: #262100;
            border-left: 4px solid var(--neon-yellow);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #222;
            border: 1px solid var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--neon-yellow);
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #00ff00;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--bg-black);
            box-shadow: 0 0 5px #00ff00;
        }

        .contact-info {
            overflow: hidden;
            flex: 1;
        }

        .contact-info h4 {
            font-size: 0.95rem;
            margin-bottom: 3px;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #221e00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
        }

        .chat-header-info h3 {
            font-size: 1rem;
            color: var(--text-main);
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: var(--neon-yellow);
        }

        .chat-header-icons i {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            margin-left: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-header-icons i:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .message-wrapper.incoming {
            align-items: flex-start;
        }

        .message-wrapper.outgoing {
            align-items: flex-end;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.incoming {
            background-color: var(--bubble-other);
            color: var(--text-main);
            border: 1px solid #333;
        }

        .message.outgoing {
            background-color: var(--bubble-me);
            color: var(--text-main);
            border: 1px solid #594d00;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.1);
        }

        .message img {
            max-width: 200px;
            border-radius: 8px;
            display: block;
        }

        .message-info {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            gap: 6px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-top: 1px solid #221e00;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .chat-input-area .tools {
            display: flex;
            gap: 12px;
        }

        .chat-input-area .tools i {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-area .tools i:hover {
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            background-color: #1a1a1a;
            border: 1px solid #443c00;
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--neon-yellow);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Emoji / Sticker Picker Popup */
        .picker-popup {
            position: absolute;
            bottom: 75px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid var(--neon-yellow);
            border-radius: 10px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            box-shadow: var(--neon-glow);
            z-index: 100;
        }

        .picker-popup span {
            font-size: 1.5rem;
            cursor: pointer;
            text-align: center;
            padding: 5px;
            border-radius: 5px;
            transition: 0.2s;
        }

        .picker-popup span:hover {
            background: #332d00;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #332d00; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-yellow); }
    </style>
</head>
<body>

    <div class="messenger-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <div class="sidebar-actions">
                    <i class="fa-solid fa-user-plus" title="Tạo cuộc trò chuyện mới" onclick="openNewChatModal()"></i>
                    <i class="fa-regular fa-pen-to-square" title="Soạn tin mới"></i>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchContact" placeholder="Tìm kiếm trên Messenger..." onkeyup="filterContacts()">
            </div>
            <div class="contact-list" id="contactList">
                <!-- Danh sách contact được tạo tự động bằng JS -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar" id="currentAvatar" style="width: 38px; height: 38px; font-size: 0.85rem; margin-right: 12px;">A</div>
                    <div class="chat-header-info">
                        <h3 id="currentChatName">Admin Neon</h3>
                        <span id="currentChatStatus">Đang hoạt động</span>
                    </div>
                </div>
                <div class="chat-header-icons">
                    <i class="fa-solid fa-circle-info" onclick="alert('Tính năng thông tin cuộc trò chuyện đang được cập nhật!')"></i>
                </div>
            </div>

            <!-- Messages Box -->
            <div class="chat-messages" id="chatMessages">
                <!-- Nội dung tin nhắn thay đổi theo đoạn chat -->
            </div>

            <!-- Emoji/Sticker Popup -->
            <div class="picker-popup" id="emojiPicker">
                <span onclick="insertEmoji('😀')">😀</span>
                <span onclick="insertEmoji('🔥')">🔥</span>
                <span onclick="insertEmoji('💛')">💛</span>
                <span onclick="insertEmoji('👍')">👍</span>
                <span onclick="insertEmoji('🚀')">🚀</span>
                <span onclick="insertEmoji('🎉')">🎉</span>
                <span onclick="insertEmoji('😎')">😎</span>
                <span onclick="insertEmoji('⚡')">⚡</span>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="tools">
                    <i class="fa-solid fa-circle-plus" title="Đính kèm ảnh" onclick="sendImage()"></i>
                    <i class="fa-regular fa-face-smile" title="Chọn Sticker/Emoji" onclick="toggleEmojiPicker()"></i>
                </div>
                <input type="text" id="messageInput" placeholder="Nhắn tin..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let chatsData = {
            1: {
                name: "Admin Neon",
                status: "Đang hoạt động",
                avatar: "A",
                messages: [
                    { sender: "incoming", text: "Chào bạn! Giao diện này đã loại bỏ tính năng gọi thoại/video.", time: "10:40" },
                    { sender: "outgoing", text: "Tuyệt vời, gọn nhẹ và tập trung vào nhắn tin hơn!", time: "10:41" }
                ]
            },
            2: {
                name: "Bot AI Cyber",
                status: "Hoạt động 5 phút trước",
                avatar: "B",
                messages: [
                    { sender: "incoming", text: "Hệ thống Cyber AI xin chào bạn.", time: "09:15" },
                    { sender: "outgoing", text: "Hôm nay thời tiết thế nào?", time: "09:16" },
                    { sender: "incoming", text: "Trời đẹp và tràn ngập ánh sáng vàng neon!", time: "09:17" }
                ]
            },
            3: {
                name: "Nhóm Sáng Tạo Web",
                status: "3 thành viên trực tuyến",
                avatar: "N",
                messages: [
                    { sender: "incoming", text: "Ai đã đẩy code lên git chưa?", time: "Hôm qua" },
                    { sender: "outgoing", text: "Đang fix nốt phần viền vàng neon cho chuẩn.", time: "Hôm qua" }
                ]
            }
        };

        let currentChatId = 1;

        function renderContacts() {
            const contactList = document.getElementById('contactList');
            contactList.innerHTML = "";
            
            for (let id in chatsData) {
                let chat = chatsData[id];
                let lastMsg = chat.messages[chat.messages.length - 1] ? chat.messages[chat.messages.length - 1].text : "";
                
                let div = document.createElement('div');
                div.classList.add('contact-item');
                if (id == currentChatId) div.classList.add('active');
                div.setAttribute('onclick', `switchChat(${id})`);
                div.innerHTML = `
                    <div class="avatar">${chat.avatar}<div class="status-dot"></div></div>
                    <div class="contact-info">
                        <h4>${chat.name}</h4>
                        <p>${lastMsg}</p>
                    </div>
                `;
                contactList.appendChild(div);
            }
        }

        function switchChat(id) {
            currentChatId = id;
            let chat = chatsData[id];
            
            document.getElementById('currentChatName').innerText = chat.name;
            document.getElementById('currentChatStatus').innerText = chat.status;
            document.getElementById('currentAvatar').innerText = chat.avatar;
            
            renderContacts();
            renderMessages();
        }

        function renderMessages() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = "";
            
            let messages = chatsData[currentChatId].messages;
            messages.forEach(msg => {
                let wrapper = document.createElement('div');
                wrapper.classList.add('message-wrapper', msg.sender);
                
                let contentHTML = '';
                if(msg.type === 'image') {
                    contentHTML = `<img src="${msg.text}" alt="Image">`;
                } else {
                    contentHTML = escapeHTML(msg.text);
                }

                wrapper.innerHTML = `
                    <div class="message ${msg.sender}">${contentHTML}</div>
                    <div class="message-info">
                        <span>${msg.time}</span>
                        ${msg.sender === 'outgoing' ? '<span>• Đã xem</span>' : ''}
                    </div>
                `;
                chatMessages.appendChild(wrapper);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chatsData[currentChatId].messages.push({
                sender: 'outgoing',
                text: text,
                time: timeString
            });

            input.value = "";
            renderMessages();
            renderContacts();

            setTimeout(() => {
                chatsData[currentChatId].messages.push({
                    sender: 'incoming',
                    text: "Đã nhận được tin nhắn: \"" + text + "\"",
                    time: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0')
                });
                renderMessages();
                renderContacts();
            }, 1500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function sendImage() {
            let imgUrl = prompt("Nhập đường dẫn hình ảnh (URL):", "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300");
            if(!imgUrl) return;

            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chatsData[currentChatId].messages.push({
                sender: 'outgoing',
                text: imgUrl,
                type: 'image',
                time: timeString
            });
            renderMessages();
            renderContacts();
        }

        function toggleEmojiPicker() {
            let picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            document.getElementById('messageInput').value += emoji;
            toggleEmojiPicker();
        }

        function openNewChatModal() {
            let friendName = prompt("Nhập tên bạn bè mới muốn thêm:");
            if(!friendName) return;
            
            let newId = Object.keys(chatsData).length + 1;
            chatsData[newId] = {
                name: friendName,
                status: "Đang hoạt động",
                avatar: friendName.charAt(0).toUpperCase(),
                messages: [{ sender: 'incoming', text: `Xin chào, mình là ${friendName} đây!`, time: 'Vừa xong' }]
            };
            switchChat(newId);
        }

        function filterContacts() {
            let keyword = document.getElementById('searchContact').value.toLowerCase();
            let items = document.querySelectorAll('.contact-item');
            items.forEach(item => {
                let name = item.querySelector('h4').innerText.toLowerCase();
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderContacts();
        renderMessages();
    </script>
</body>
</html>
