<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Thiết Kế Ảnh Đại Diện Lớp Học</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện chụp ảnh html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- CỘT 1: ĐIỀU KHIỂN (TÙY CHỈNH) -->
        <div class="space-y-4">
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-pink-500">
                    🎨 Thiết Kế Avatar Lớp
                </h1>
                <p class="text-slate-400 text-sm mt-1">Tạo ảnh đại diện siêu ngầu cho lớp học của bạn chỉ trong vài giây!</p>
            </div>

            <!-- Nhập tên lớp -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Tên Lớp:</label>
                <input type="text" id="classNameInput" value="7C" maxlength="6" 
                    class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500 font-bold uppercase text-base"
                    oninput="updateAvatar()">
            </div>

            <!-- Nhập Slogan / Trường -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Slogan / Tên Trường:</label>
                <input type="text" id="sloganInput" value="VÔ ĐỐI - UNSTOPPABLE" 
                    class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500 text-xs"
                    oninput="updateAvatar()">
            </div>

            <!-- Nhập Tên Nhà Thiết Kế -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Designer / Người Thiết Kế:</label>
                <input type="text" id="designerInput" value="Design by 7C" 
                    class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500 text-xs"
                    oninput="updateAvatar()">
            </div>

            <!-- Chọn màu nền -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Chọn Kiểu Màu Nền:</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setTheme('from-blue-600 to-indigo-900')" class="h-9 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-950 border-2 border-white/25 hover:scale-105 transition"></button>
                    <button onclick="setTheme('from-pink-600 to-purple-900')" class="h-9 rounded-lg bg-gradient-to-r from-pink-600 to-purple-950 border-2 border-white/25 hover:scale-105 transition"></button>
                    <button onclick="setTheme('from-emerald-600 to-teal-900')" class="h-9 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-950 border-2 border-white/25 hover:scale-105 transition"></button>
                    <button onclick="setTheme('from-amber-500 to-red-900')" class="h-9 rounded-lg bg-gradient-to-r from-amber-500 to-red-950 border-2 border-white/25 hover:scale-105 transition"></button>
                </div>
            </div>

            <!-- Nút tải ảnh -->
            <button onclick="downloadAvatar()" 
                class="w-full py-3 bg-gradient-to-r from-blue-500 to-pink-500 hover:from-blue-600 hover:to-pink-600 font-bold rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2 text-sm">
                📥 Tải Ảnh Đại Diện Về Máy
            </button>
        </div>

        <!-- CỘT 2: KHU VỰC XEM TRƯỚC (PREVIEW AVATAR) -->
        <div class="flex flex-col items-center justify-center">
            <div class="text-xs font-medium text-slate-400 mb-3">Khu vực hiển thị (Khung hình vuông):</div>
            
            <!-- Khung Avatar cần chụp (ID: avatar-preview) -->
            <div id="avatar-preview" class="w-64 h-64 md:w-72 md:h-72 rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-950 p-4 flex flex-col items-center justify-between shadow-2xl relative overflow-hidden border-4 border-white/2">
                
                <!-- Hiệu ứng trang trí nền mờ ảo -->
                <div class="absolute -top-12 -left-12 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
                <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-black/20 rounded-full blur-xl"></div>

                <!-- Phần trên: Tên nhà thiết kế -->
                <div class="z-10 w-full text-center">
                    <span id="previewDesigner" class="text-[10px] uppercase font-bold tracking-widest text-slate-300/80 bg-black/20 px-2.5 py-1 rounded-full border border-white/5">
                        Design by 7C
                    </span>
                </div>

                <!-- Nội dung chính giữa -->
                <div class="my-auto text-center z-10">
                    <span class="text-[11px] uppercase tracking-widest text-pink-300 font-extrabold block mb-0.5">We Are</span>
                    <h2 id="previewClass" class="text-6xl md:text-7xl font-black tracking-tight text-white drop-shadow-md">7C</h2>
                </div>

                <!-- Phần dưới chân avatar: Slogan -->
                <div class="z-10 bg-black/30 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
                    <p id="previewSlogan" class="text-[10px] font-bold text-slate-200 tracking-wider uppercase">VÔ ĐỐI - UNSTOPPABLE</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Script xử lý logic -->
    <script>
        const classNameInput = document.getElementById('classNameInput');
        const sloganInput = document.getElementById('sloganInput');
        const designerInput = document.getElementById('designerInput');
        
        const previewClass = document.getElementById('previewClass');
        const previewSlogan = document.getElementById('previewSlogan');
        const previewDesigner = document.getElementById('previewDesigner');
        const avatarPreview = document.getElementById('avatar-preview');

        // Cập nhật chữ theo thời gian thực
        function updateAvatar() {
            previewClass.innerText = classNameInput.value || '7C';
            previewSlogan.innerText = sloganInput.value || 'LỚP TÔI SỐ 1';
            previewDesigner.innerText = designerInput.value || 'Design by Team';
        }

        // Đổi màu nền gradient
        function setTheme(gradientClass) {
            avatarPreview.className = avatarPreview.className.replace(/from-\S+ to-\S+/g, '');
            avatarPreview.classList.add(...gradientClass.split(' '));
        }

        // Chức năng tải ảnh xuống bằng html2canvas
        function downloadAvatar() {
            html2canvas(avatarPreview, {
                scale: 3, 
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Avatar-Lop-${classNameInput.value || '7C'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
