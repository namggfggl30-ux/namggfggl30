<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Thiết Kế Avatar Lớp Pro + Sticker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500/30 selection:text-indigo-200">

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-[0_0_60px_-15px_rgba(79,70,229,0.4)] p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- BẢNG ĐIỀU KHIỂN CỦA DESIGNER -->
        <div class="space-y-4">
            <div>
                <span class="text-xs uppercase tracking-widest px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 font-bold border border-indigo-500/20">Designer Mode v3.0</span>
                <h1 class="text-2xl font-black mt-2 bg-gradient-to-br from-indigo-400 via-white to-pink-300 bg-clip-text text-transparent">
                    Studio Avatar & Sticker
                </h1>
                <p class="text-slate-400 text-xs mt-1">Tùy biến tên lớp, thêm hình dán sticker và chọn tông màu độc quyền.</p>
            </div>

            <div class="space-y-3">
                <!-- Chọn Hình dán (Sticker) -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">1. Chọn Hình Dán (Sticker Trang Trí):</label>
                    <div class="grid grid-cols-6 gap-1.5">
                        <button onclick="setSticker('👑')" class="h-9 bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">👑</button>
                        <button onclick="setSticker('⭐')" class="h-9 bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">⭐</button>
                        <button onclick="setSticker('🔥')" class="h-9 bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">🔥</button>
                        <button onclick="setSticker('💎')" class="h-9 bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">💎</button>
                        <button onclick="setSticker('😎')" class="h-9 bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">😎</button>
                        <button onclick="setSticker('')" class="h-9 bg-slate-800 hover:bg-rose-600/30 border border-slate-700 rounded-xl text-xs font-bold text-slate-400 transition flex items-center justify-center">Xóa</button>
                    </div>
                </div>

                <!-- Tên Lớp Chính -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">2. Tên Lớp Chính:</label>
                    <input type="text" id="classNameInput" value="7C" maxlength="6" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 font-black uppercase text-sm tracking-wider text-indigo-300 transition"
                        oninput="updateAvatar()">
                </div>

                <!-- Slogan -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">3. Slogan / Khẩu Hiệu:</label>
                    <input type="text" id="sloganInput" value="VÔ ĐỐI - UNSTOPPABLE" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-xs text-slate-200 transition"
                        oninput="updateAvatar()">
                </div>

                <!-- Tên Designer -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">4. Tên Người Thiết Kế (Designer):</label>
                    <input type="text" id="designerInput" value="Design by 7C" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-xs text-slate-400 transition"
                        oninput="updateAvatar()">
                </div>

                <!-- Chọn màu nền -->
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-300">5. Chọn Tông Màu Nền:</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setTheme('from-blue-700 via-indigo-900 to-slate-950', 'border-blue-500/40')" class="h-9 rounded-xl bg-gradient-to-br from-blue-700 to-slate-950 border-2 border-white/10 hover:scale-105 transition"></button>
                        <button onclick="setTheme('from-fuchsia-800 via-purple-900 to-slate-950', 'border-fuchsia-500/40')" class="h-9 rounded-xl bg-gradient-to-br from-fuchsia-800 to-slate-950 border-2 border-white/10 hover:scale-105 transition"></button>
                        <button onclick="setTheme('from-emerald-700 via-teal-900 to-slate-950', 'border-emerald-500/40')" class="h-9 rounded-xl bg-gradient-to-br from-emerald-700 to-slate-950 border-2 border-white/10 hover:scale-105 transition"></button>
                        <button onclick="setTheme('from-amber-600 via-orange-900 to-slate-950', 'border-amber-500/40')" class="h-9 rounded-xl bg-gradient-to-br from-amber-600 to-slate-950 border-2 border-white/10 hover:scale-105 transition"></button>
                    </div>
                </div>
            </div>

            <!-- Nút tải ảnh -->
            <button onclick="downloadAvatar()" 
                class="w-full py-3 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-extrabold rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2 text-sm">
                📥 Tải Ảnh Đại Diện Hình Tròn (Chuẩn TikTok)
            </button>
        </div>

        <!-- KHU VỰC XEM TRƯỚC (CHUẨN HÌNH TRÒN) -->
        <div class="flex flex-col items-center justify-center">
            <span class="text-xs font-medium text-slate-400 mb-3 tracking-wide">Mẫu hiển thị thực tế:</span>
            
            <!-- Khung Avatar Tròn -->
            <div id="avatar-preview" class="w-72 h-72 rounded-full bg-gradient-to-br from-blue-700 via-indigo-900 to-slate-950 p-6 flex flex-col items-center justify-between shadow-2xl relative overflow-hidden border-4 border-blue-500/40">
                
                <!-- Họa tiết nền mờ -->
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white/10 via-transparent to-black/50 pointer-events-none"></div>

                <!-- Vòng tròn viền mỏng bên trong -->
                <div class="absolute inset-3 rounded-full border border-white/10 pointer-events-none"></div>

                <!-- Top: Designer -->
                <div class="z-10 mt-4 text-center">
                    <span id="previewDesigner" class="text-[9px] uppercase tracking-widest font-extrabold text-indigo-200 bg-black/40 px-3 py-1 rounded-full border border-white/5 backdrop-blur-sm">
                        Design by 7C
                    </span>
                </div>

                <!-- Center: Sticker + Tên Lớp -->
                <div class="my-auto text-center z-10 space-y-0.5 flex flex-col items-center">
                    <div id="previewSticker" class="text-3xl drop-shadow-lg mb-[-4px]">👑</div>
                    <h2 id="previewClass" class="text-6xl font-black tracking-tighter text-white drop-shadow-[0_3px_8px_rgba(0,0,0,0.6)]">7C</h2>
                </div>

                <!-- Bottom: Slogan -->
                <div class="z-10 mb-4 text-center">
                    <div class="bg-black/40 backdrop-blur-sm px-3.5 py-1.5 rounded-xl border border-white/10 inline-block">
                        <p id="previewSlogan" class="text-[9px] font-bold text-slate-100 tracking-wider uppercase">VÔ ĐỐI - UNSTOPPABLE</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Xử Lý -->
    <script>
        const designerInput = document.getElementById('designerInput');
        const classNameInput = document.getElementById('classNameInput');
        const sloganInput = document.getElementById('sloganInput');
        
        const previewDesigner = document.getElementById('previewDesigner');
        const previewClass = document.getElementById('previewClass');
        const previewSlogan = document.getElementById('previewSlogan');
        const previewSticker = document.getElementById('previewSticker');
        const avatarPreview = document.getElementById('avatar-preview');

        function updateAvatar() {
            previewDesigner.innerText = designerInput.value || 'DESIGNER';
            previewClass.innerText = classNameInput.value || '7C';
            previewSlogan.innerText = sloganInput.value || 'SLOGAN';
        }

        // Chọn hình dán sticker
        function setSticker(emoji) {
            previewSticker.innerText = emoji;
            if(emoji === '') {
                previewSticker.style.display = 'none';
            } else {
                previewSticker.style.display = 'block';
            }
        }

        function setTheme(gradientClass, borderColor) {
            avatarPreview.className = avatarPreview.className.replace(/from-\S+ via-\S+ to-\S+/g, '');
            avatarPreview.classList.add(...gradientClass.split(' '));
            
            avatarPreview.className = avatarPreview.className.replace(/border-\S+-\S+/g, '');
            avatarPreview.classList.add(borderColor);
        }

        function downloadAvatar() {
            html2canvas(avatarPreview, {
                scale: 4, 
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Avatar-Sticker-Lop-${classNameInput.value || '7C'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
