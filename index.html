<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chat Nhóm - Cloud Realtime</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Nhúng thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-color: #fe2c55; 
            --bubble-text-color: #ffffff;
            --bg-color: #050505;
            --box-bg: rgba(18, 18, 18, 0.85);
            --text-color: #ffffff;
            --sidebar-bg: rgba(12, 12, 12, 0.95);
            --input-bg: rgba(26, 26, 26, 0.6);
            --other-bubble-bg: #262626;
            --other-bubble-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .neon-box {
            position: relative;
            width: 420px;
            padding: 40px;
            background: var(--box-bg);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 30px var(--neon-color);
        }

        .neon-box.wide-box {
            width: 1050px;
            height: 650px;
            display: flex;
            flex-direction: row;
            padding: 0;
            overflow: hidden;
        }

        .sidebar-members {
            width: 290px;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 15px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--neon-color);
            text-transform: uppercase;
        }

        .members-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }

        .member-info-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .member-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--neon-color);
            flex-shrink: 0;
        }

        .member-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-actions { display: flex; gap: 4px; }

        .mini-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-color);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .mini-btn.del-user { border-color: #ff5252; color: #ff5252; }
        .mini-btn.del-user:hover { background: #ff5252; color: #fff; }

        .mini-btn.perm-btn { border-color: #00ffcc; color: #00ffcc; }
        .mini-btn.perm-btn:hover { background: #00ffcc; color: #050505; }

        .chat-main-container { flex: 1; display: flex; flex-direction: column; }

        h2 { text-align: center; margin-bottom: 25px; font-size: 24px; font-weight: 700; text-transform: uppercase; color: var(--text-color); }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; margin-bottom: 8px; opacity: 0.8; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--neon-color); }

        .neon-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--neon-color);
            color: var(--text-color);
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            box-shadow: 0 0 10px var(--neon-color);
            margin-top: 10px;
        }
        .neon-btn:hover { background: var(--neon-color); color: #050505; }

        .switch-form { text-align: center; margin-top: 20px; font-size: 14px; opacity: 0.8; }
        .switch-form a { color: var(--neon-color); cursor: pointer; font-weight: 600; }

        .hidden { display: none !important; }
        .error-msg { color: #ff5252; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }

        .chat-header {
            padding: 15px 25px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile-section { display: flex; align-items: center; gap: 12px; }

        .avatar-container {
            position: relative;
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--neon-color);
            object-fit: cover;
            background: #222;
        }

        .chat-header-info h3 { font-size: 16px; font-weight: 600; }
        .chat-header-info span { font-size: 12px; opacity: 0.6; }

        .header-actions { display: flex; gap: 10px; }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn.danger { border-color: #ff5252; color: #ff5252; }
        .action-btn.danger:hover { background: #ff5252; color: #fff; }

        .chat-body {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row { display: flex; max-width: 75%; gap: 10px; }
        .message-row.my-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.other-message { align-self: flex-start; }

        .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }

        .msg-content-wrapper { display: flex; flex-direction: column; }
        .message-sender { font-size: 11px; opacity: 0.6; margin-bottom: 3px; padding-left: 4px; }
        .message-bubble-container { display: flex; align-items: center; gap: 8px; }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            word-break: break-word;
            line-height: 1.4;
        }

        .my-message .message-bubble { background: var(--neon-color); color: var(--bubble-text-color); border-bottom-right-radius: 4px; }
        .other-message .message-bubble { background: var(--other-bubble-bg); color: var(--other-bubble-text); border-bottom-left-radius: 4px; }

        .delete-msg-btn { background: none; border: none; color: #ff5252; font-size: 12px; cursor: pointer; opacity: 0; }
        .message-row.my-message:hover .delete-msg-btn { opacity: 1; }

        .chat-footer {
            padding: 15px 25px;
            background: var(--sidebar-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }
        .chat-footer input { flex: 1; padding: 12px 18px; border-radius: 12px; font-size: 14px; background: var(--input-bg); }

        .send-btn {
            padding: 0 24px;
            background: var(--neon-color);
            color: var(--bubble-text-color);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }

        .color-palette {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(18, 18, 18, 0.85);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: #ffffff; }
    </style>
</head>
<body>

    <div class="color-palette">
        <div class="color-dot active" style="background: #fe2c55;" onclick="setTheme('#fe2c55', '#ffffff', this)"></div>
        <div class="color-dot" style="background: #00ffcc;" onclick="setTheme('#00ffcc', '#050505', this)"></div>
        <div class="color-dot" style="background: #00d2ff;" onclick="setTheme('#00d2ff', '#050505', this)"></div>
        <div class="color-dot" style="background: #b000ff;" onclick="setTheme('#b000ff', '#ffffff', this)"></div>
    </div>

    <div class="neon-box" id="authBox">
        <div id="loginForm">
            <h2>Đăng Nhập</h2>
            <div class="form-group"><label>Tài khoản</label><input type="text" id="loginUser" placeholder="Nhập tài khoản..."></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="loginPass" placeholder="Nhập mật khẩu..."></div>
            <div id="loginError" class="error-msg"></div>
            <button class="neon-btn" onclick="handleLogin()">Đăng Nhập</button>
            <div class="switch-form">Chưa có tài khoản? <a onclick="toggleForm('register')">Đăng ký ngay</a></div>
        </div>

        <div id="registerForm" class="hidden">
            <h2>Đăng Ký</h2>
            <div class="form-group"><label>Tên người dùng</label><input type="text" id="regUser" placeholder="Chọn tên..."></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPass" placeholder="Mật khẩu..."></div>
            <div id="regError" class="error-msg"></div>
            <button class="neon-btn" onclick="handleRegister()">Đăng Ký</button>
            <div class="switch-form">Đã có tài khoản? <a onclick="toggleForm('login')">Đăng nhập ngay</a></div>
        </div>
    </div>

    <div class="neon-box hidden wide-box" id="homeBox">
        <div class="sidebar-members">
            <div class="sidebar-header">Thành viên nhóm</div>
            <div class="members-list" id="membersListContainer"></div>
        </div>

        <div class="chat-main-container">
            <div class="chat-header">
                <div class="user-profile-section">
                    <div class="avatar-container" onclick="triggerFileUpload()">
                        <img id="userAvatarImg" class="avatar-preview" src="https://i.imgur.com/6VBx3io.png">
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleFileSelected(event)">
                    <div class="chat-header-info">
                        <h3 id="welcomeUser">Tên</h3>
                        <span>Đám mây Realtime</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn danger" onclick="deleteAccount()">Xóa Tài Khoản</button>
                    <button class="action-btn" onclick="logoutHome()">Đăng Xuất</button>
                </div>
            </div>

            <div class="chat-body" id="chatBodyContainer"></div>

            <div class="chat-footer">
                <input type="text" id="chatInput" placeholder="Gửi tin nhắn..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        // -----------------------------------------------------------------
        // BƯỚC QUAN TRỌNG: Thay cấu hình Firebase của bạn vào đây
        // -----------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY",
            authDomain: "PROJECT_ID.firebaseapp.com",
            databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let allMembersData = {};
        let allMessagesData = [];

        // Lắng nghe dữ liệu thành viên từ Database real-time toàn cầu
        db.ref('members').on('value', (snapshot) => {
            allMembersData = snapshot.val() || {};
            renderMembersList();
            if (currentUser) {
                // Cập nhật lại thông tin currentUser nếu bị thay đổi quyền từ admin
                if (allMembersData[currentUser.username]) {
                    currentUser = allMembersData[currentUser.username];
                }
            }
        });

        // Lắng nghe tin nhắn từ Database real-time toàn cầu
        db.ref('messages').on('value', (snapshot) => {
            let data = snapshot.val() || {};
            allMessagesData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            renderMessages();
        });

        function setTheme(color, textColor, element) {
            document.documentElement.style.setProperty('--neon-color', color);
            document.documentElement.style.setProperty('--bubble-text-color', textColor);
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function toggleForm(type) {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('regError').style.display = 'none';
            if (type === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
            }
        }

        function handleRegister() {
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            const errorMsg = document.getElementById('regError');

            if (!username || !password) {
                errorMsg.textContent = 'Vui lòng điền đầy đủ thông tin!';
                errorMsg.style.display = 'block';
                return;
            }

            if (allMembersData[username]) {
                errorMsg.textContent = 'Tên người dùng đã tồn tại!';
                errorMsg.style.display = 'block';
                return;
            }

            // Mặc định tài khoản mới tạo sẽ có canDelete = false (không thấy nút xóa)
            const newUser = { 
                username, 
                password, 
                avatar: "https://i.imgur.com/6VBx3io.png", 
                canDelete: false 
            };

            db.ref('members/' + username).set(newUser, (error) => {
                if (!error) {
                    document.getElementById('regUser').value = '';
                    document.getElementById('regPass').value = '';
                    toggleForm('login');
                }
            });
        }

        function handleLogin() {
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (!userInput || !passInput) {
                errorMsg.textContent = 'Vui lòng nhập tài khoản và mật khẩu!';
                errorMsg.style.display = 'block';
                return;
            }

            // Tài khoản admin tối cao tự tạo nếu đăng nhập lần đầu
            if (userInput === 'namggfggl30' && !allMembersData['namggfggl30']) {
                currentUser = { username: 'namggfggl30', password: passInput, avatar: "https://i.imgur.com/6VBx3io.png", canDelete: true };
                db.ref('members/namggfggl30').set(currentUser);
            } else {
                let user = allMembersData[userInput];
                if (user && user.password === passInput) {
                    currentUser = user;
                } else {
                    errorMsg.textContent = 'Sai tài khoản hoặc mật khẩu!';
                    errorMsg.style.display = 'block';
                    return;
                }
            }

            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('homeBox').classList.remove('hidden');
            document.getElementById('welcomeUser').textContent = currentUser.username;
            document.getElementById('userAvatarImg').src = currentUser.avatar;
            renderMembersList();
            renderMessages();
        }

        function logoutHome() {
            currentUser = null;
            document.getElementById('homeBox').classList.add('hidden');
            document.getElementById('authBox').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

        function triggerFileUpload() { document.getElementById('avatarFileInput').click(); }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    currentUser.avatar = base64Image;
                    document.getElementById('userAvatarImg').src = base64Image;
                    db.ref('members/' + currentUser.username).update({ avatar: base64Image });
                };
                reader.readAsDataURL(file);
            }
        }

        function deleteAccount() {
            if (confirm("Bạn có chắc chắn muốn xóa tài khoản này không?")) {
                db.ref('members/' + currentUser.username).remove();
                logoutHome();
            }
        }

        // Chỉ tài khoản Admin ('namggfggl30') mới có quyền đổi trạng thái cấp phép cho người khác
        function toggleDeletePermission(targetUsername) {
            if (currentUser.username !== 'namggfggl30') return;
            let targetUser = allMembersData[targetUsername];
            if (targetUser) {
                let newStatus = !targetUser.canDelete;
                db.ref('members/' + targetUsername).update({ canDelete: newStatus });
            }
        }

        function adminDeleteUser(targetUsername) {
            if (targetUsername === 'namggfggl30') return;
            if (confirm(`Xóa tài khoản "${targetUsername}"?`)) {
                db.ref('members/' + targetUsername).remove();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const newMsgRef = db.ref('messages').push();
            newMsgRef.set({
                sender: currentUser.username,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function deleteMessage(msgId) {
            db.ref('messages/' + msgId).remove();
        }

        function renderMembersList() {
            const listContainer = document.getElementById('membersListContainer');
            if(!listContainer) return;
            listContainer.innerHTML = '';

            Object.keys(allMembersData).forEach(username => {
                let mem = allMembersData[username];
                let item = document.createElement('div');
                item.className = 'member-item';
                
                let isMe = currentUser && currentUser.username === mem.username;
                let isBoss = currentUser && currentUser.username === 'namggfggl30';
                
                // Điều kiện hiển thị nút Xóa: Bạn phải là Admin HOẶC được bạn (Admin) cấp quyền (canDelete = true)
                let canI_Delete = currentUser && (currentUser.username === 'namggfggl30' || currentUser.canDelete === true) && mem.username !== 'namggfggl30';

                let actionsHtml = `<div class="member-actions">`;
                if (canI_Delete && !isMe) {
                    actionsHtml += `<button class="mini-btn del-user" onclick="adminDeleteUser('${mem.username}')">Xóa</button>`;
                }
                // Chỉ tài khoản namggfggl30 mới thấy nút "Cấp quyền / Thu hồi"
                if (isBoss && mem.username !== 'namggfggl30') {
                    let permText = mem.canDelete ? 'Thu hồi' : 'Cấp quyền';
                    actionsHtml += `<button class="mini-btn perm-btn" onclick="toggleDeletePermission('${mem.username}')">${permText}</button>`;
                }
                actionsHtml += `</div>`;

                item.innerHTML = `
                    <div class="member-info-left">
                        <img class="member-avatar" src="${mem.avatar || 'https://i.imgur.com/6VBx3io.png'}">
                        <span class="member-name">${mem.username} ${mem.canDelete ? '🛡️' : ''}</span>
                    </div>
                    ${actionsHtml}
                `;
                listContainer.appendChild(item);
            });
        }

        function renderMessages() {
            const container = document.getElementById('chatBodyContainer');
            if(!container) return;
            container.innerHTML = '';

            // Sắp xếp tin nhắn theo thời gian cũ đến mới
            allMessagesData.sort((a, b) => a.timestamp - b.timestamp);

            if (allMessagesData.length === 0) {
                container.innerHTML = `<div style="text-align: center; opacity: 0.5; font-size: 14px; margin: auto;">Chưa có tin nhắn nào. Hãy bắt đầu trò chuyện!</div>`;
                return;
            }

            allMessagesData.forEach(msg => {
                let isMe = currentUser && msg.sender === currentUser.username;
                let row = document.createElement('div');
                row.className = `message-row ${isMe ? 'my-message' : 'other-message'}`;

                let foundMem = allMembersData[msg.sender];
                let currentAvatar = foundMem ? foundMem.avatar : 'https://i.imgur.com/6VBx3io.png';

                if (isMe) {
                    row.innerHTML = `
                        <div class="msg-content-wrapper">
                            <div class="message-bubble-container">
                                <button class="delete-msg-btn" onclick="deleteMessage('${msg.id}')">Xóa</button>
                                <div class="message-bubble">${msg.text}</div>
                            </div>
                        </div>
                    `;
                } else {
                    row.innerHTML = `
                        <img class="msg-avatar" src="${currentAvatar}">
                        <div class="msg-content-wrapper">
                            <div class="message-sender">${msg.sender}</div>
                            <div class="message-bubble-container">
                                <div class="message-bubble">${msg.text}</div>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
