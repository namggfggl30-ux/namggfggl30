<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Avatar Lớp - Vàng Neon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Hiệu ứng phát sáng vàng neon toàn tập */
        .neon-gold-glow {
            border: 4px solid #facc15;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.7), inset 0 0 20px rgba(250, 204, 21, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- BẢNG ĐIỀU KHIỂN -->
        <div class="space-y-4">
            <div>
                <span class="text-xs uppercase tracking-widest px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 font-bold border border-amber-500/20">Pure Gold Neon Edition</span>
                <h1 class="text-2xl font-black mt-2 bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent">
                    Thiết Kế Avatar Vàng Neon
                </h1>
                <p class="text-slate-400 text-xs mt-1">Tự do thay đổi thông tin theo ý thích, không chứa từ khóa cũ.</p>
            </div>

            <div class="space-y-3">
                <!-- Chọn Sticker -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">1. Chọn Biểu Tượng / Sticker:</label>
                    <div class="grid grid-cols-6 gap-1.5">
                        <button onclick="setSticker('👑')" class="h-9 bg-slate-800 hover:bg-amber-500/20 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">👑</button>
                        <button onclick="setSticker('⭐')" class="h-9 bg-slate-800 hover:bg-amber-500/20 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">⭐</button>
                        <button onclick="setSticker('🔥')" class="h-9 bg-slate-800 hover:bg-amber-500/20 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">🔥</button>
                        <button onclick="setSticker('💎')" class="h-9 bg-slate-800 hover:bg-amber-500/20 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">💎</button>
                        <button onclick="setSticker('😎')" class="h-9 bg-slate-800 hover:bg-amber-500/20 border border-slate-700 rounded-xl text-lg transition flex items-center justify-center">😎</button>
                        <button onclick="setSticker('')" class="h-9 bg-slate-800 hover:bg-rose-600/30 border border-slate-700 rounded-xl text-xs font-bold text-slate-400 transition flex items-center justify-center">Xóa</button>
                    </div>
                </div>

                <!-- Tên Lớp -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">2. Tên Lớp:</label>
                    <input type="text" id="classNameInput" value="7C" maxlength="6" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 font-black uppercase text-sm tracking-wider text-amber-300 transition"
                        oninput="updateAvatar()">
                </div>

                <!-- Slogan mới (Đã bỏ từ vô đối) -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">3. Slogan Mới:</label>
                    <input type="text" id="sloganInput" value="ALWAYS TOGETHER" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-xs text-slate-200 transition"
                        oninput="updateAvatar()">
                </div>

                <!-- Tên Designer -->
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">4. Tên Người Thiết Kế:</label>
                    <input type="text" id="designerInput" value="DESIGN BY 7C" 
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-xs text-slate-400 transition"
                        oninput="updateAvatar()">
                </div>
            </div>

            <!-- Nút tải ảnh -->
            <button onclick="downloadAvatar()" 
                class="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-extrabold rounded-xl shadow-lg shadow-amber-500/20 transform active:scale-95 transition flex items-center justify-center gap-2 text-sm">
                📥 Tải Ảnh Đại Diện Vàng Neon
            </button>
        </div>

        <!-- KHU VỰC XEM TRƯỚC (HÌNH TRÒN - VÀNG NEON) -->
        <div class="flex flex-col items-center justify-center">
            <span class="text-xs font-medium text-slate-400 mb-3 tracking-wide">Mẫu hiển thị hình tròn thực tế:</span>
            
            <!-- Khung Avatar Tròn Viền Vàng Neon -->
            <div id="avatar-preview" class="w-72 h-72 rounded-full bg-gradient-to-br from-zinc-950 via-neutral-900 to-black p-6 flex flex-col items-center justify-between relative overflow-hidden neon-gold-glow">
                
                <!-- Họa tiết ánh sáng vàng nền -->
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-400/15 via-transparent to-black/80 pointer-events-none"></div>

                <!-- Viền phụ bên trong -->
                <div class="absolute inset-3 rounded-full border border-amber-400/30 pointer-events-none"></div>

                <!-- Top: Designer / Lớp trên -->
                <div class="z-10 mt-3 text-center">
                    <span id="previewTop" class="text-[9px] uppercase tracking-widest font-extrabold text-amber-300 bg-black/60 px-3 py-1 rounded-full border border-amber-400/40 backdrop-blur-sm shadow-[0_0_10px_rgba(250,204,21,0.3)]">
                        LỚP 7C
                    </span>
                </div>

                <!-- Center: Sticker + Tên Lớp chính -->
                <div class="my-auto text-center z-10 space-y-0.5 flex flex-col items-center">
                    <div id="previewSticker" class="text-3xl drop-shadow-[0_0_12px_rgba(250,204,21,0.8)] mb-[-4px]">👑</div>
                    <h2 id="previewClass" class="text-6xl font-black tracking-tighter text-amber-300 drop-shadow-[0_0_20px_rgba(250,204,21,0.7)]">7C</h2>
                    <p id="previewSlogan" class="text-[9px] font-bold text-amber-100/90 tracking-[0.2em] uppercase mt-0.5 drop-shadow">ALWAYS TOGETHER</p>
                </div>

                <!-- Bottom: Designer -->
                <div class="z-10 mb-3 text-center">
                    <span id="previewDesigner" class="text-[9px] uppercase tracking-widest font-extrabold text-amber-300 bg-black/60 px-3.5 py-1 rounded-full border border-amber-400/40 backdrop-blur-sm shadow-[0_0_10px_rgba(250,204,21,0.3)] inline-block">
                        DESIGN BY 7C
                    </span>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Xử Lý -->
    <script>
        const designerInput = document.getElementById('designerInput');
        const classNameInput = document.getElementById('classNameInput');
        const sloganInput = document.getElementById('sloganInput');
        
        const previewDesigner = document.getElementById('previewDesigner');
        const previewClass = document.getElementById('previewClass');
        const previewSlogan = document.getElementById('previewSlogan');
        const previewTop = document.getElementById('previewTop');
        const previewSticker = document.getElementById('previewSticker');
        const avatarPreview = document.getElementById('avatar-preview');

        function updateAvatar() {
            const val = classNameInput.value || '7C';
            previewClass.innerText = val;
            previewTop.innerText = 'LỚP ' + val;
            previewSlogan.innerText = sloganInput.value || 'ALWAYS TOGETHER';
            previewDesigner.innerText = designerInput.value || 'DESIGN BY 7C';
        }

        function setSticker(emoji) {
            previewSticker.innerText = emoji;
            if(emoji === '') {
                previewSticker.style.display = 'none';
            } else {
                previewSticker.style.display = 'block';
            }
        }

        function downloadAvatar() {
            html2canvas(avatarPreview, {
                scale: 4, 
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Avatar-Neon-Gold-${classNameInput.value || '7C'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
