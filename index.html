<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #bcc0c4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8abaf;
        }
    </style>
</head>
<body class="h-full bg-white text-gray-900 flex overflow-hidden select-none font-sans">

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-white flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 space-y-6 shadow-xl">
            <div class="text-center space-y-2">
                <i class="fa-brands fa-facebook-messenger text-6xl text-[#0084FF]"></i>
                <h1 id="authTitle" class="text-2xl font-bold tracking-tight text-gray-900">Đăng nhập vào Messenger</h1>
                <p class="text-xs text-gray-500">Kết nối với bạn bè và thế giới xung quanh bạn.</p> đoạn chat
            </div>

            <!-- Form Đăng Nhập -->
            <div id="loginForm" class="space-y-4">
                <div>
                    <input type="text" id="loginUsername" placeholder="Email hoặc tên đăng nhập" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="Mật khẩu" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
                <button onclick="handleLogin()" class="w-full py-3 bg-[#0084FF] text-white font-bold rounded-xl hover:bg-[#006dd6] transition tracking-wide text-sm">Đăng nhập</button>
                
                <p class="text-center text-xs text-gray-600 pt-2">
                    Chưa có tài khoản? <span onclick="switchAuthMode('register')" class="text-[#0084FF] font-semibold cursor-pointer hover:underline">Tạo tài khoản mới</span>
                </p>
            </div>

            <!-- Form Đăng Ký -->
            <div id="registerForm" class="space-y-4 hidden">
                <div>
                    <input type="text" id="regName" placeholder="Tên hiển thị của bạn" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
                <div>
                    <input type="text" id="regUsername" placeholder="Tên đăng nhập" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
                <div>
                    <input type="password" id="regPassword" placeholder="Mật khẩu mới" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
                <button onclick="handleRegister()" class="w-full py-3 bg-[#0084FF] text-white font-bold rounded-xl hover:bg-[#006dd6] transition tracking-wide text-sm">Đăng ký</button>
                
                <p class="text-center text-xs text-gray-600 pt-2">
                    Đã có tài khoản? <span onclick="switchAuthMode('login')" class="text-[#0084FF] font-semibold cursor-pointer hover:underline">Đăng nhập ngay</span>
                </p>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH (CHUẨN MESSENGER WEB) -->
    <div id="mainApp" class="h-full w-full flex overflow-hidden hidden bg-white">
        
        <!-- THANH ĐIỀU HƯỚNG CỰC TRÁI (ICON BAR) -->
        <div class="w-16 border-r border-gray-200 flex flex-col items-center justify-between py-3 bg-white">
            <div class="flex flex-col items-center space-y-4">
                <i class="fa-brands fa-facebook-messenger text-4xl text-[#0084FF] cursor-pointer"></i>
                <div class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600 cursor-pointer text-xl" title="Đoạn chat"><i class="fa-solid fa-comment"></i></div>
            </div>
            <div class="flex flex-col items-center space-y-3">
                <div class="relative cursor-pointer" onclick="openAccountModal()">
                    <img id="currentUserAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
            </div>
        </div>

        <!-- SIDEBAR DANH SÁCH CHAT (CỘT 2) -->
        <div class="w-80 border-r border-gray-200 flex flex-col h-full bg-white">
            <div class="p-4 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Đoạn chat</h1>
                <div class="flex space-x-1">
                    <button onclick="openAccountModal()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-700 transition" title="Cài đặt tài khoản"><i class="fa-solid fa-gear text-sm"></i></button>
                    <button onclick="handleLogout()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-red-600 transition" title="Đăng xuất"><i class="fa-solid fa-arrow-right-from-bracket text-sm"></i></button>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="px-3 pb-2">
                <div class="bg-gray-100 rounded-full flex items-center px-3 py-2 space-x-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
                    <input type="text" id="searchContact" oninput="filterContacts(this.value)" placeholder="Tìm kiếm trên Messenger" class="bg-transparent border-none outline-none text-sm w-full placeholder-gray-500 text-gray-900">
                </div>
            </div>

            <!-- Danh sách đoạn chat -->
            <div id="contactList" class="flex-1 overflow-y-auto px-2 space-y-0.5 mt-1"></div>
        </div>

        <!-- KHUNG CHAT CHÍNH (CỘT 3) -->
        <div id="chatArea" class="flex-1 flex flex-col h-full bg-white relative">
            <div id="noChatSelected" class="flex-1 flex flex-col items-center justify-center text-gray-400">
                <i class="fa-brands fa-facebook-messenger text-6xl mb-3 text-gray-300"></i>
                <p class="text-base font-normal">Chọn một đoạn chat hoặc bắt đầu cuộc trò chuyện mới.</p>
            </div>

            <div id="activeChatContainer" class="flex-1 flex flex-col h-full hidden">
                <!-- Header đoạn chat -->
                <div class="px-4 py-2.5 border-b border-gray-200 flex items-center justify-between bg-white shadow-xs z-10">
                    <div class="flex items-center space-x-3 cursor-pointer">
                        <div class="relative">
                            <img id="activeChatAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                        </div>
                        <div>
                            <h3 id="activeChatName" class="font-semibold text-sm text-gray-900"></h3>
                            <p class="text-xs text-gray-500">Đang hoạt động</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 text-[#0084FF]">
                        <button class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition"><i class="fa-solid fa-phone text-base"></i></button>
                        <button class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition"><i class="fa-solid fa-video text-base"></i></button>
                        <button onclick="toggleSidebarRight()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition"><i class="fa-solid fa-circle-info text-base"></i></button>
                    </div>
                </div>

                <!-- Khu vực hiển thị tin nhắn -->
                <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-2 bg-white"></div>

                <!-- Thanh nhập tin nhắn chuẩn Messenger -->
                <div class="p-3 border-t border-gray-200 flex items-center space-x-2 bg-white">
                    <div class="flex items-center space-x-1 text-[#0084FF]">
                        <label class="w-9 h-9 rounded-full hover:bg-blue-50 flex items-center justify-center cursor-pointer transition" title="Đính kèm file/ảnh">
                            <i class="fa-solid fa-circle-plus text-lg"></i>
                            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="sendImage(event)">
                        </label>
                        <label class="w-9 h-9 rounded-full hover:bg-blue-50 flex items-center justify-center cursor-pointer transition" title="Đính kèm ảnh">
                            <i class="fa-solid fa-image text-lg"></i>
                            <input type="file" accept="image/*" class="hidden" onchange="sendImage(event)">
                        </label>
                    </div>

                    <div class="flex-1 bg-gray-100 rounded-full flex items-center px-4 py-2 space-x-2">
                        <input type="text" id="messageInput" placeholder="Aa" class="bg-transparent border-none outline-none text-sm w-full placeholder-gray-500 text-gray-900" onkeypress="handleKeyPress(event)">
                        <i class="fa-regular fa-face-smile text-gray-500 cursor-pointer hover:text-gray-700 text-lg"></i>
                    </div>

                    <button id="sendBtn" onclick="sendMessage()" class="text-[#0084FF] text-xl w-10 h-10 rounded-full hover:bg-blue-50 flex items-center justify-center transition">
                        <i id="sendIcon" class="fa-solid fa-thumbs-up text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SIDEBAR PHẢI (THÔNG TIN CHI TIẾT - CỘT 4) -->
        <div id="rightSidebar" class="w-80 border-l border-gray-200 flex flex-col h-full bg-white hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <span class="font-semibold text-sm text-gray-900">Thông tin chi tiết</span>
                <button onclick="toggleSidebarRight()" class="text-gray-500 hover:text-gray-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="flex flex-col items-center p-6 border-b border-gray-200">
                <img id="infoAvatar" src="" class="w-20 h-20 rounded-full object-cover mb-3">
                <h3 id="infoName" class="font-bold text-base text-gray-900"></h3>
                <p class="text-xs text-gray-500 mt-0.5">Đang hoạt động</p>
            </div>
            <div class="p-4 space-y-1">
                <button onclick="clearCurrentChat()" class="w-full py-2.5 px-3 rounded-lg text-red-600 hover:bg-red-50 transition flex items-center space-x-3 text-sm font-medium">
                    <i class="fa-solid fa-trash-can w-5"></i>
                    <span>Xóa đoạn chat</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT / QUẢN LÍ TÀI KHOẢN -->
    <div id="accountModal" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md bg-white rounded-2xl p-6 space-y-5 shadow-2xl relative border border-gray-100">
            <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                <h3 class="font-bold text-lg text-gray-900">Cài đặt tài khoản</h3>
                <button onclick="closeAccountModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-4">
                <div class="flex flex-col items-center space-y-2">
                    <img id="modalAvatarPreview" src="" class="w-20 h-20 rounded-full object-cover">
                    <label class="text-xs text-[#0084FF] font-semibold cursor-pointer hover:underline">
                        Đổi ảnh đại diện
                        <input type="file" id="modalAvatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tên hiển thị</label>
                    <input type="text" id="modalNameInput" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tên đăng nhập</label>
                    <input type="text" id="modalUsernameInput" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu mới (để trống nếu không đổi)</label>
                    <input type="password" id="modalPasswordInput" placeholder="Mật khẩu mới" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm text-gray-900 outline-none focus:border-[#0084FF] focus:bg-white transition">
                </div>
            </div>

            <div class="flex flex-col space-y-2 pt-2">
                <div class="flex space-x-3">
                    <button onclick="closeAccountModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm font-semibold hover:bg-gray-200 transition">Hủy</button>
                    <button onclick="saveAccountChanges()" class="flex-1 py-2.5 bg-[#0084FF] text-white rounded-xl text-sm font-semibold hover:bg-[#006dd6] transition">Lưu thay đổi</button>
                </div>
                <button onclick="deleteAccount()" class="w-full py-2.5 text-red-600 hover:bg-red-50 rounded-xl text-xs font-semibold transition">
                    Xóa vĩnh viễn tài khoản
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC CHUẨN MESSENGER -->
    <script>
        let users = JSON.parse(localStorage.getItem('messenger_users')) || [
            { id: '1', username: 'admin', password: '123', name: 'Nguyễn Văn A', avatar: 'https://i.pravatar.cc/150?img=12' },
            { id: '2', username: 'friend', password: '123', name: 'Trần Thị B', avatar: 'https://i.pravatar.cc/150?img=32' },
            { id: '3', username: 'bot', password: '123', name: 'Trợ lý ảo AI', avatar: 'https://i.pravatar.cc/150?img=68' }
        ];

        let currentUser = JSON.parse(localStorage.getItem('messenger_current_user')) || null;
        let activeContactId = null;
        let messages = JSON.parse(localStorage.getItem('messenger_messages')) || {
            '2': [{ sender: '2', text: 'Chào bạn, chúng ta cùng trò chuyện nhé!', time: '10:00 SA', isRevoked: false }]
        };
        let tempNewAvatar = '';

        window.onload = function() {
            if (currentUser) appInit();
        }

        function switchAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Tạo tài khoản mới';
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Đăng nhập vào Messenger';
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if(!name || !username || !password) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }

            if(users.find(u => u.username === username)) {
                alert('Tên đăng nhập đã tồn tại!');
                return;
            }

            users.push({
                id: Date.now().toString(),
                username,
                password,
                name,
                avatar: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`
            });
            localStorage.setItem('messenger_users', JSON.stringify(users));
            alert('Đăng ký thành công!');
            switchAuthMode('login');
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const user = users.find(u => u.username === username && u.password === password);
            if(!user) {
                alert('Sai tên đăng nhập hoặc mật khẩu!');
                return;
            }

            currentUser = user;
            localStorage.setItem('messenger_current_user', JSON.stringify(currentUser));
            appInit();
        }

        function handleLogout() {
            localStorage.removeItem('messenger_current_user');
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function appInit() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('currentUserAvatar').src = currentUser.avatar;
            renderContacts();
        }

        function openAccountModal() {
            document.getElementById('modalAvatarPreview').src = currentUser.avatar;
            document.getElementById('modalNameInput').value = currentUser.name;
            document.getElementById('modalUsernameInput').value = currentUser.username;
            document.getElementById('modalPasswordInput').value = '';
            tempNewAvatar = currentUser.avatar;
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function closeAccountModal() {
            document.getElementById('accountModal').classList.add('hidden');
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempNewAvatar = e.target.result;
                document.getElementById('modalAvatarPreview').src = tempNewAvatar;
            }
            reader.readAsDataURL(file);
        }

        function saveAccountChanges() {
            const newName = document.getElementById('modalNameInput').value.trim();
            const newUsername = document.getElementById('modalUsernameInput').value.trim();
            const newPassword = document.getElementById('modalPasswordInput').value.trim();

            if(!newName || !newUsername) {
                alert('Tên không được để trống!');
                return;
            }

            currentUser.name = newName;
            currentUser.username = newUsername;
            currentUser.avatar = tempNewAvatar;
            if(newPassword) currentUser.password = newPassword;

            const index = users.findIndex(u => u.id === currentUser.id);
            if(index !== -1) users[index] = currentUser;

            localStorage.setItem('messenger_users', JSON.stringify(users));
            localStorage.setItem('messenger_current_user', JSON.stringify(currentUser));

            appInit();
            closeAccountModal();
            alert('Cập nhật tài khoản thành công!');
        }

        function deleteAccount() {
            if(confirm('Bạn có chắc chắn muốn xóa vĩnh viễn tài khoản này?')) {
                users = users.filter(u => u.id !== currentUser.id);
                localStorage.setItem('messenger_users', JSON.stringify(users));
                localStorage.removeItem('messenger_current_user');
                currentUser = null;
                closeAccountModal();
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('authScreen').classList.remove('hidden');
            }
        }

        function renderContacts(filterText = '') {
            const listEl = document.getElementById('contactList');
            listEl.innerHTML = '';
            
            users.filter(u => u.id !== currentUser.id && u.name.toLowerCase().includes(filterText.toLowerCase())).forEach(contact => {
                const chatKey = [currentUser.id, contact.id].sort().join('_');
                const chatLog = messages[chatKey] || [];
                const lastMsgObj = chatLog.length > 0 ? chatLog[chatLog.length - 1] : null;
                const lastMsg = lastMsgObj ? (lastMsgObj.isRevoked ? 'Tin nhắn đã thu hồi' : (lastMsgObj.type === 'image' ? '[Hình ảnh]' : lastMsgObj.text)) : 'Các bạn đã kết nối trên Messenger';
                const isSelected = activeContactId === contact.id;

                const div = document.createElement('div');
                div.className = `flex items-center space-x-3 p-2.5 rounded-xl cursor-pointer transition ${isSelected ? 'bg-gray-200' : 'hover:bg-gray-100'}`;
                div.onclick = () => selectContact(contact.id);
                div.innerHTML = `
                    <div class="relative">
                        <img src="${contact.avatar}" class="w-12 h-12 rounded-full object-cover">
                        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-sm truncate text-gray-900">${contact.name}</h4>
                        <p class="text-xs text-gray-500 truncate mt-0.5">${lastMsg}</p>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function filterContacts(val) {
            renderContacts(val);
        }

        function selectContact(id) {
            activeContactId = id;
            const contact = users.find(u => u.id === id);

            document.getElementById('noChatSelected').classList.add('hidden');
            document.getElementById('activeChatContainer').classList.remove('hidden');

            document.getElementById('activeChatName').innerText = contact.name;
            document.getElementById('activeChatAvatar').src = contact.avatar;
            document.getElementById('infoName').innerText = contact.name;
            document.getElementById('infoAvatar').src = contact.avatar;

            renderContacts();
            loadMessages();
        }

        function loadMessages() {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            
            const chatKey = [currentUser.id, activeContactId].sort().join('_');
            const chatLog = messages[chatKey] || [];

            chatLog.forEach((msg, index) => {
                const isMe = msg.sender === currentUser.id;
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-0.5`;

                let contentHtml = '';
                if(msg.isRevoked) {
                    contentHtml = `<div class="px-3 py-2 rounded-2xl text-xs italic text-gray-500 bg-gray-100 border border-gray-200 cursor-pointer hover:border-red-400 hover:text-red-500 transition" title="Bấm lần nữa để gỡ vĩnh viễn">Tin nhắn đã thu hồi (Bấm để gỡ)</div>`;
                } else if(msg.type === 'image') {
                    contentHtml = `<img src="${msg.text}" class="max-w-xs rounded-2xl shadow-xs">`;
                } else if(msg.text === '👍') {
                    contentHtml = `<span class="text-4xl">👍</span>`;
                } else {
                    contentHtml = `<div class="px-4 py-2 rounded-2xl max-w-sm text-sm ${isMe ? 'bg-[#0084FF] text-white rounded-br-xs' : 'bg-gray-200 text-gray-900 rounded-bl-xs'}">${msg.text}</div>`;
                }

                const timeSpan = document.createElement('span');
                timeSpan.className = "text-[10px] text-gray-400 px-1";
                timeSpan.innerText = msg.time || '';

                const innerWrapper = document.createElement('div');
                innerWrapper.innerHTML = contentHtml;
                
                if(isMe) {
                    innerWrapper.style.cursor = 'pointer';
                    innerWrapper.onclick = () => handleMessageClick(index);
                }

                msgDiv.appendChild(innerWrapper);
                msgDiv.appendChild(timeSpan);
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        // Bấm lần 1: Thu hồi. Bấm lần nữa (khi đã thu hồi): Gỡ hoàn toàn khỏi đoạn chat.
        function handleMessageClick(index) {
            const chatKey = [currentUser.id, activeContactId].sort().join('_');
            if(!messages[chatKey] || !messages[chatKey][index]) return;

            const msg = messages[chatKey][index];

            if(!msg.isRevoked) {
                if(confirm('Thu hồi tin nhắn này?')) {
                    msg.isRevoked = true;
                    msg.text = 'Đã thu hồi';
                    localStorage.setItem('messenger_messages', JSON.stringify(messages));
                    loadMessages();
                    renderContacts();
                }
            } else {
                if(confirm('Gỡ (xóa) vĩnh viễn tin nhắn này khỏi đoạn chat?')) {
                    messages[chatKey].splice(index, 1);
                    localStorage.setItem('messenger_messages', JSON.stringify(messages));
                    loadMessages();
                    renderContacts();
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if(!activeContactId) return;

            if(!text) text = '👍';

            const chatKey = [currentUser.id, activeContactId].sort().join('_');
            if(!messages[chatKey]) messages[chatKey] = [];
            
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages[chatKey].push({ sender: currentUser.id, text: text, time: timeStr, isRevoked: false });
            
            localStorage.setItem('messenger_messages', JSON.stringify(messages));
            input.value = '';
            document.getElementById('sendIcon').className = "fa-solid fa-thumbs-up text-lg";
            
            loadMessages();
            renderContacts();
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if(!file || !activeContactId) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const chatKey = [currentUser.id, activeContactId].sort().join('_');
                if(!messages[chatKey]) messages[chatKey] = [];
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                messages[chatKey].push({ sender: currentUser.id, type: 'image', text: e.target.result, time: timeStr, isRevoked: false });
                
                localStorage.setItem('messenger_messages', JSON.stringify(messages));
                loadMessages();
                renderContacts();
            }
            reader.readAsDataURL(file);
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        const inputField = document.getElementById('messageInput');
        inputField.addEventListener('input', (e) => {
            const sendIcon = document.getElementById('sendIcon');
            sendIcon.className = e.target.value.trim().length > 0 ? "fa-solid fa-paper-plane text-lg" : "fa-solid fa-thumbs-up text-lg";
        });

        function toggleSidebarRight() {
            document.getElementById('rightSidebar').classList.toggle('hidden');
        }

        function clearCurrentChat() {
            if(confirm('Xóa toàn bộ cuộc trò chuyện này?')) {
                const chatKey = [currentUser.id, activeContactId].sort().join('_');
                delete messages[chatKey];
                localStorage.setItem('messenger_messages', JSON.stringify(messages));
                loadMessages();
                renderContacts();
            }
        }
    </script>
</body>
</html>
