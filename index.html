<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chat Nhóm - Neon Cyberpunk</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-color: #fe2c55; /* Mặc định kiểu TikTok hồng đỏ */
            --bg-color: #050505;
            --box-bg: rgba(18, 18, 18, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .neon-box {
            position: relative;
            width: 420px;
            padding: 40px;
            background: var(--box-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 30px var(--neon-color),
                        inset 0 0 20px rgba(254, 44, 85, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neon-box.wide-box {
            width: 900px;
            height: 600px;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #d0d0d0;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--neon-color);
            background: rgba(26, 26, 26, 0.9);
            box-shadow: 0 0 12px var(--neon-color);
        }

        .neon-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--neon-color);
            color: #ffffff;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 14px;
            box-shadow: 0 0 10px var(--neon-color);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .neon-btn:hover {
            background: var(--neon-color);
            color: #050505;
            box-shadow: 0 0 25px var(--neon-color);
            transform: translateY(-2px);
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #a0a0a0;
        }

        .switch-form a {
            color: var(--neon-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .switch-form a:hover {
            text-shadow: 0 0 8px var(--neon-color);
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        /* Giao diện Header Chat chuẩn TikTok */
        .chat-header {
            padding: 15px 25px;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-preview {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--neon-color);
            object-fit: cover;
            cursor: pointer;
            background: #222;
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .chat-header-info span {
            font-size: 12px;
            color: #a0a0a0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.3s;
        }

        .action-btn.danger {
            border-color: #ff5252;
            color: #ff5252;
        }

        .action-btn.danger:hover {
            background: #ff5252;
            color: #fff;
        }

        .action-btn:hover {
            border-color: var(--neon-color);
            color: var(--neon-color);
        }

        /* Khung chat bên trong */
        .chat-body {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(5, 5, 5, 0.5);
        }

        .chat-body::-webkit-scrollbar {
            width: 5px;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: var(--neon-color);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            max-width: 75%;
            gap: 10px;
        }

        .message-row.my-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.other-message {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-content-wrapper {
            display: flex;
            flex-direction: column;
        }

        .other-message .msg-content-wrapper {
            align-items: flex-start;
        }

        .message-sender {
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
            font-weight: 500;
            padding-left: 4px;
        }

        .message-bubble-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            word-break: break-word;
            line-height: 1.4;
        }

        .my-message .message-bubble {
            background: var(--neon-color);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .other-message .message-bubble {
            background: #262626;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        .delete-msg-btn {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .message-row.my-message:hover .delete-msg-btn {
            opacity: 1;
        }

        .chat-footer {
            padding: 15px 25px;
            background: rgba(20, 20, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .chat-footer input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            background: rgba(30, 30, 30, 0.8);
        }

        .send-btn {
            padding: 0 24px;
            background: var(--neon-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 13px;
        }

        .send-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--neon-color);
        }

        /* Các ô tròn màu ở góc màn hình để đổi màu viền nhanh */
        .color-palette {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }
    </style>
</head>
<body>

    <!-- Các ô tròn chọn màu viền nhanh -->
    <div class="color-palette">
        <div class="color-dot active" style="background: #fe2c55;" onclick="setTheme('#fe2c55', this)" title="Đỏ TikTok"></div>
        <div class="color-dot" style="background: #00ffcc;" onclick="setTheme('#00ffcc', this)" title="Xanh Neon"></div>
        <div class="color-dot" style="background: #00d2ff;" onclick="setTheme('#00d2ff', this)" title="Xanh Dương"></div>
        <div class="color-dot" style="background: #b000ff;" onclick="setTheme('#b000ff', this)" title="Tím Cyber"></div>
        <div class="color-dot" style="background: #ffe600;" onclick="setTheme('#ffe600', this)" title="Vàng Chanh"></div>
    </div>

    <!-- 1. Form Đăng Nhập / Đăng Ký -->
    <div class="neon-box" id="authBox">
        <div id="loginForm">
            <h2>Đăng Nhập</h2>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="loginUser" placeholder="Nhập tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
            </div>
            <div id="loginError" class="error-msg"></div>
            <button class="neon-btn" onclick="handleLogin()">Đăng Nhập</button>
            <div class="switch-form">
                Chưa có tài khoản? <a onclick="toggleForm('register')">Đăng ký ngay</a>
            </div>
        </div>

        <div id="registerForm" class="hidden">
            <h2>Đăng Ký</h2>
            <div class="form-group">
                <label>Tên người dùng</label>
                <input type="text" id="regUser" placeholder="Chọn tên hiển thị...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="regPass" placeholder="Tạo mật khẩu...">
            </div>
            <div id="regError" class="error-msg"></div>
            <button class="neon-btn" onclick="handleRegister()">Đăng Ký</button>
            <div class="switch-form">
                Đã có tài khoản? <a onclick="toggleForm('login')">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <!-- 2. Giao diện Chat Nhóm Kiểu TikTok -->
    <div class="neon-box hidden wide-box" id="homeBox">
        <div class="chat-header">
            <div class="user-profile-section">
                <img id="userAvatarImg" class="avatar-preview" src="https://i.imgur.com/6VBx3io.png" title="Nhấn để đổi ảnh đại diện" onclick="changeAvatar()">
                <div class="chat-header-info">
                    <h3 id="welcomeUser">Tên</h3>
                    <span>Tin Nhắn Nhóm</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="action-btn danger" onclick="deleteAccount()">Xóa Tài Khoản</button>
                <button class="action-btn" onclick="logoutHome()">Đăng Xuất</button>
            </div>
        </div>

        <div class="chat-body" id="chatBodyContainer"></div>

        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Gửi tin nhắn..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        // Hàm đổi màu viền neon thông qua các ô tròn
        function setTheme(color, element) {
            document.documentElement.style.setProperty('--neon-color', color);
            
            // Đổi trạng thái active cho ô tròn được chọn
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            element.classList.add('active');
        }

        let currentUser = null;

        function toggleForm(type) {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('regError').style.display = 'none';
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            if (type === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        function getMembers() {
            let members = localStorage.getItem('neon_members');
            return members ? JSON.parse(members) : [];
        }

        function saveMembers(members) {
            localStorage.setItem('neon_members', JSON.stringify(members));
        }

        function getMessages() {
            let messages = localStorage.getItem('neon_messages');
            return messages ? JSON.parse(messages) : [];
        }

        function saveMessages(messages) {
            localStorage.setItem('neon_messages', JSON.stringify(messages));
        }

        function handleRegister() {
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            const errorMsg = document.getElementById('regError');

            if (!username || !password) {
                errorMsg.textContent = 'Vui lòng điền đầy đủ thông tin!';
                errorMsg.style.display = 'block';
                return;
            }

            let members = getMembers();
            if (members.some(m => m.username === username)) {
                errorMsg.textContent = 'Tên người dùng này đã tồn tại!';
                errorMsg.style.display = 'block';
                return;
            }

            const defaultAvatar = "https://i.imgur.com/6VBx3io.png";
            members.push({ username, password, avatar: defaultAvatar });
            saveMembers(members);

            document.getElementById('regUser').value = '';
            document.getElementById('regPass').value = '';
            toggleForm('login');
        }

        function handleLogin() {
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (!userInput || !passInput) {
                errorMsg.textContent = 'Vui lòng nhập tài khoản và mật khẩu!';
                errorMsg.style.display = 'block';
                return;
            }

            let members = getMembers();
            let validUser = members.find(m => m.username === userInput && m.password === passInput);

            if (validUser || (userInput === 'admin' && passInput === 'admin')) {
                errorMsg.style.display = 'none';
                
                if (userInput === 'admin') {
                    currentUser = { username: 'Admin', avatar: "https://i.imgur.com/6VBx3io.png" };
                } else {
                    currentUser = validUser;
                }
                
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('homeBox').classList.remove('hidden');
                document.getElementById('welcomeUser').textContent = currentUser.username;
                document.getElementById('userAvatarImg').src = currentUser.avatar;
                
                renderMessages();
            } else {
                errorMsg.textContent = 'Sai tài khoản hoặc mật khẩu!';
                errorMsg.style.display = 'block';
            }
        }

        function logoutHome() {
            currentUser = null;
            document.getElementById('homeBox').classList.add('hidden');
            document.getElementById('authBox').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
        }

        function changeAvatar() {
            let newAvatarUrl = prompt("Nhập đường dẫn hình ảnh (URL ảnh) mới cho avatar của bạn:", currentUser.avatar);
            if (newAvatarUrl && newAvatarUrl.trim() !== "") {
                currentUser.avatar = newAvatarUrl.trim();
                document.getElementById('userAvatarImg').src = currentUser.avatar;

                let members = getMembers();
                let idx = members.findIndex(m => m.username === currentUser.username);
                if (idx !== -1) {
                    members[idx].avatar = currentUser.avatar;
                    saveMembers(members);
                }
                renderMessages();
            }
        }

        function deleteAccount() {
            if (currentUser.username === 'Admin') {
                alert("Tài khoản Admin hệ thống không thể xóa!");
                return;
            }
            
            let confirmDel = confirm("Bạn có chắc chắn muốn vĩnh viễn xóa tài khoản này không?");
            if (confirmDel) {
                let members = getMembers();
                members = members.filter(m => m.username !== currentUser.username);
                saveMembers(members);
                logoutHome();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            let messages = getMessages();
            messages.push({ 
                id: Date.now(), 
                sender: currentUser.username, 
                avatar: currentUser.avatar, 
                text: text 
            });
            saveMessages(messages);

            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function deleteMessage(id) {
            let messages = getMessages();
            messages = messages.filter(msg => msg.id !== id);
            saveMessages(messages);
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chatBodyContainer');
            container.innerHTML = '';
            let messages = getMessages();

            if (messages.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #666; font-size: 14px; margin: auto;">Chưa có tin nhắn nào trong nhóm. Hãy bắt đầu trò chuyện!</div>`;
                return;
            }

            messages.forEach(msg => {
                let isMe = msg.sender === currentUser.username;
                let row = document.createElement('div');
                row.className = `message-row ${isMe ? 'my-message' : 'other-message'}`;

                let members = getMembers();
                let foundMem = members.find(m => m.username === msg.sender);
                let currentAvatar = foundMem ? foundMem.avatar : msg.avatar;

                if (isMe) {
                    row.innerHTML = `
                        <div class="msg-content-wrapper">
                            <div class="message-bubble-container">
                                <button class="delete-msg-btn" onclick="deleteMessage(${msg.id})" title="Xóa tin nhắn">Xóa</button>
                                <div class="message-bubble">${msg.text}</div>
                            </div>
                        </div>
                    `;
                } else {
                    row.innerHTML = `
                        <img class="msg-avatar" src="${currentAvatar || 'https://i.imgur.com/6VBx3io.png'}">
                        <div class="msg-content-wrapper">
                            <div class="message-sender">${msg.sender}</div>
                            <div class="message-bubble-container">
                                <div class="message-bubble">${msg.text}</div>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(row);
            });

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
