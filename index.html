<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đăng Nhập / Đăng Ký - Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Công cụ đổi màu viền neon -->
    <div class="color-picker-container">
        <label for="colorPicker">Đổi màu viền:</label>
        <input type="color" id="colorPicker" value="#00ffcc">
    </div>

    <!-- Khung giao diện chính (Đăng nhập / Đăng ký) -->
    <div class="neon-box" id="authBox">
        
        <!-- FORM ĐĂNG NHẬP -->
        <div id="loginForm">
            <h2>Đăng Nhập</h2>
            <div class="form-group">
                <label>Tên đăng nhập hoặc Email</label>
                <input type="text" id="loginUser" placeholder="Nhập tài khoản của bạn...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
            </div>
            <button class="neon-btn" onclick="handleLogin()">Đăng Nhập</button>
            <div class="switch-form">
                Chưa có tài khoản? <a onclick="toggleForm('register')">Đăng ký ngay</a>
            </div>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div id="registerForm" class="hidden">
            <h2>Đăng Ký</h2>
            <div class="form-group">
                <label>Tên người dùng</label>
                <input type="text" id="regUser" placeholder="Chọn tên hiển thị...">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Nhập địa chỉ email...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="regPass" placeholder="Tạo mật khẩu mới...">
            </div>
            <button class="neon-btn" onclick="handleRegister()">Đăng Ký</button>
            <div class="switch-form">
                Đã có tài khoản? <a onclick="toggleForm('login')">Đăng nhập</a>
            </div>
        </div>

    </div>

    <!-- KHUNG QUẢN LÝ / KIỂM TRA THÀNH VIÊN (Ẩn hiện khi cần) -->
    <div class="neon-box hidden" id="adminBox" style="width: 550px;">
        <h2>Danh Sách Thành Viên</h2>
        <div class="table-container">
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>Tên người dùng</th>
                        <th>Email</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="memberListBody">
                    <!-- Dữ liệu thành viên sẽ được thêm vào đây bằng JS -->
                </tbody>
            </table>
        </div>
        <button class="neon-btn" style="margin-top: 20px;" onclick="logoutAdmin()">Quay lại Đăng nhập</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
